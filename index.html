<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cellular Automata</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, opacity 0.2s;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        button:active { background-color: #0056b3; }
        .btn-secondary {
            background-color: #333333;
        }
        .btn-secondary:active { background-color: #444444; }
        .control-group {
            margin: 25px 0;
            text-align: left;
        }
        label {
            display: block;
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 8px;
        }
        .rate-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .step-btn {
            width: auto;
            flex: 0 0 auto;
            padding: 8px 5px;
            font-size: 11px;
            font-weight: 600;
            line-height: 1;
            background-color: #333333;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .step-btn:active { background-color: #444444; }
        .rate-field {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            min-width: 0;
            background-color: #333333;
            border: 1px solid #444444;
            border-radius: 8px;
            padding: 0 8px;
        }
        .rate-field:focus-within {
            border-color: #007aff;
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
        }
        .rate-field input {
            flex: 1 1 auto;
            min-width: 0;
            width: 100%;
            padding: 9px 0;
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
            background: transparent;
            border: none;
            outline: none;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .rate-field input:disabled { color: #777777; }
        .rate-field .unit {
            padding-left: 4px;
            font-size: 13px;
            color: #888888;
        }
        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 500;
            color: #ffffff;
            background-color: #333333;
            border: 1px solid #444444;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }
        select:focus {
            border-color: #007aff;
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
        }
        #status { font-size: 12px; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Cellular Automata</h2>
    
    <div class="btn-row">
        <button id="connectBtn" onclick="connectBLE()">Connect</button>
        <button id="disconnectBtn" class="btn-secondary" onclick="disconnectBLE()" disabled>Disconnect</button>
    </div>

    <div class="control-group">
        <label id="presetLabel">Preset:</label>
        <select id="presetDropdown" onchange="updatePreset(this.value)" disabled>
            <option value="" hidden>Custom</option>
            <option value="0">Mitosos</option>
            <option value="1">Coral</option>
            <option value="2">Fingerpr.</option>
            <option value="3">Spiral</option>
            <option value="4">Worm</option>
            <option value="5">Maze</option>
            <option value="6">Bubbles</option>
            <option value="7">Spot/Loop</option>
            <option value="8">Waves</option>
            <option value="9">Splotch</option>
            <option value="10">Solition</option>
            <option value="11">Dot</option>
            <option value="12">Stripe</option>
            <option value="13">X/Wave</option>
            <option value="14">Mixed</option>
        </select>
    </div>

    <div class="control-group">
        <label id="spawnChanceLabel">Spawn Chance</label>
        <select id="spawnChanceDropdown" onchange="updateSpawnChance(this.value)" disabled>
            <option value="0">Never</option>
            <option value="1">0.01%</option>
            <option value="10">0.10%</option>
            <option value="20">0.20%</option>
            <option value="25">0.25%</option>
            <option value="50">0.50%</option>
            <option value="75">0.75%</option>
            <option value="100">1.00%</option>
            <option value="150">1.50%</option>
            <option value="200">2.00%</option>
            <option value="250">2.50%</option>
            <option value="300">3.00%</option>
            <option value="500">5.00%</option>
            <option value="750">7.50%</option>
            <option value="1000">10.00%</option>
            <option value="1250">12.50%</option>
            <option value="1500">15.00%</option>
            <option value="1750">17.50%</option>
            <option value="2000">20.00%</option>
            <option value="2500">25.00%</option>
            <option value="3000">30.00%</option>
            <option value="3500">35.00%</option>
            <option value="4000">40.00%</option>
            <option value="4500">45.00%</option>
            <option value="5000">50.00%</option>
        </select>
    </div>

    <div class="control-group">
        <label>Feed Rate</label>
        <div class="rate-row">
            <button type="button" class="step-btn" data-rate="feed" data-delta="-0.10" disabled>−0.10</button>
            <button type="button" class="step-btn" data-rate="feed" data-delta="-0.01" disabled>−0.01</button>
            <span class="rate-field">
                <input type="text" id="feedRateInput" inputmode="decimal" value="0.32" disabled>
                <span class="unit">%</span>
            </span>
            <button type="button" class="step-btn" data-rate="feed" data-delta="0.01" disabled>+0.01</button>
            <button type="button" class="step-btn" data-rate="feed" data-delta="0.10" disabled>+0.10</button>
        </div>
    </div>

    <div class="control-group">
        <label>Kill Rate</label>
        <div class="rate-row">
            <button type="button" class="step-btn" data-rate="kill" data-delta="-0.10" disabled>−0.10</button>
            <button type="button" class="step-btn" data-rate="kill" data-delta="-0.01" disabled>−0.01</button>
            <span class="rate-field">
                <input type="text" id="killRateInput" inputmode="decimal" value="0.32" disabled>
                <span class="unit">%</span>
            </span>
            <button type="button" class="step-btn" data-rate="kill" data-delta="0.01" disabled>+0.01</button>
            <button type="button" class="step-btn" data-rate="kill" data-delta="0.10" disabled>+0.10</button>
        </div>
    </div>

    <div class="btn-row">
        <button id="clearBtn" class="btn-secondary" onclick="clearDevice()" disabled>Clear</button>
    </div>

    <p id="status">Device: Disconnected</p>
</div>

<script>
let bleDevice = null;
let controlCharacteristic = null;
let stateCharacteristic = null;
let notificationsEnabled = false;
let stateRequestTimer = null;
let stateRequestFallback = null;

const DEFAULT_SETTINGS = {
    feedRate: 32,
    killRate: 32,
    spawnChance: 100,
    preset: 0
};

const currentSettings = { ...DEFAULT_SETTINGS };

const SERVICE_UUID = '41424344-4546-4748-494a-4b4c4d4e4f50';
const CHARACTERISTIC_UUID = '51525354-5556-5758-595a-5b5c5d5e5f60';

/*
 * Optional dedicated characteristic for state replies. It must have the
 * notify (or indicate, or read) property; the control characteristic above is
 * write-only and cannot send data back. If the device does not expose it, the
 * browser falls back to using the control characteristic when that one can
 * notify or be read.
 */
const STATE_CHARACTERISTIC_UUID = '51525354-5556-5758-595a-5b5c5d5e5f61';

/*
 * Control protocol (all 16-bit values big-endian, high byte first)
 *
 * Browser -> device, write (3 bytes): [command, hi, lo]
 *   0x41  feed rate     percent * 100   (1..10000, i.e. 0.01%..10.00%)
 *   0x42  kill rate     percent * 100   (0..10000)
 *   0x43  spawn chance  percent * 100   (0..5000)
 *   0x44  preset index                  (0..14)
 *   0x40  request full state; hi/lo ignored (sent as 0x00 0x00)
 *   0x45  clear the display; hi/lo ignored (sent as 0x00 0x00)
 *
 * Device -> browser, notify (9 bytes):
 *   [0x40, feedHi, feedLo, killHi, killLo, spawnHi, spawnLo, presetHi, presetLo]
 *
 * In the state reply, preset 0xFFFF (-1 as int16) means "custom": the feed or
 * kill rate was edited by hand, so no preset is selected.
 *
 * The device may also notify a single 3-byte frame with the same layout as a
 * write (0x41..0x44) to push one changed value; the browser applies both.
 * If the characteristic has no notify/indicate property, the browser sends
 * 0x40 and then reads the characteristic once to get the same 9-byte frame.
 */

const STATE_REQUEST_COMMAND = 0x40;
const STATE_TIMEOUT_MS = 1500;
const READ_FALLBACK_DELAY_MS = 250;

const RATE_CONFIG = {
    feed: {
        inputId: 'feedRateInput',
        setting: 'feedRate',
        command: 0x41,
        min: 1,
        max: 10000
    },
    kill: {
        inputId: 'killRateInput',
        setting: 'killRate',
        command: 0x42,
        min: 0,
        max: 10000
    }
};

const CONTROL_FIELDS = {
    0x41: RATE_CONFIG.feed,
    0x42: RATE_CONFIG.kill,
    0x43: { setting: 'spawnChance', min: 0, max: 5000 },
    0x44: { setting: 'preset', min: -1, max: 14, signed: true }
};

const STATE_FIELD_COMMANDS = [0x41, 0x42, 0x43, 0x44];

function formatPercent(rawValue) {
    const value = Number(rawValue) || 0;
    return (value / 100).toFixed(2);
}

function parsePercent(text) {
    const cleaned = String(text).replace(/%/g, '').replace(/\s/g, '').replace(',', '.');
    if (cleaned === '') {
        return NaN;
    }
    const value = Number(cleaned);
    return Number.isFinite(value) ? Math.round(value * 100) : NaN;
}

function setControlState(connected) {
    const controls = [
        document.getElementById('feedRateInput'),
        document.getElementById('killRateInput'),
        document.getElementById('spawnChanceDropdown'),
        document.getElementById('presetDropdown')
    ];

    controls.forEach(control => {
        control.disabled = !connected;
    });

    document.querySelectorAll('.step-btn').forEach(button => {
        button.disabled = !connected;
    });

    document.getElementById('connectBtn').disabled = connected;
    document.getElementById('disconnectBtn').disabled = !connected;
    document.getElementById('clearBtn').disabled = !connected;
}

function setSpawnChanceOption(value) {
    const dropdown = document.getElementById('spawnChanceDropdown');
    const raw = String(value);
    const match = Array.from(dropdown.options).find(option => option.value === raw);
    const dynamic = dropdown.querySelector('option[data-dynamic]');

    if (match) {
        if (dynamic) {
            dynamic.remove();
        }
    } else {
        const option = dynamic || document.createElement('option');
        if (!dynamic) {
            option.dataset.dynamic = 'true';
            dropdown.appendChild(option);
        }
        option.value = raw;
        option.textContent = `${(value / 100).toFixed(2)}%`;
    }

    dropdown.value = raw;
}

function applyCurrentControlsToUI() {
    Object.values(RATE_CONFIG).forEach(rate => {
        const input = document.getElementById(rate.inputId);
        if (document.activeElement === input) {
            return;
        }
        input.value = formatPercent(currentSettings[rate.setting]);
    });
    setSpawnChanceOption(currentSettings.spawnChance);

    const presetDropdown = document.getElementById('presetDropdown');
    presetDropdown.value = currentSettings.preset < 0 ? '' : String(currentSettings.preset);
}

function clearPresetSelection() {
    currentSettings.preset = -1;
    document.getElementById('presetDropdown').value = '';
}

async function sendControlValue(command, value) {
    if (!controlCharacteristic) {
        return;
    }

    const safeValue = Math.max(0, Math.min(65535, Number(value) || 0));
    const high = Math.floor(safeValue / 256);
    const low = safeValue % 256;
    const data = new Uint8Array([command, high, low]);

    try {
        await controlCharacteristic.writeValueWithoutResponse(data);
    } catch (error) {
        console.error('Write error:', error);
    }
}

function clampControlValue(field, value) {
    return Math.max(field.min, Math.min(field.max, Math.round(Number(value) || 0)));
}

function clearStateRequest() {
    if (stateRequestTimer !== null) {
        clearTimeout(stateRequestTimer);
        stateRequestTimer = null;
    }
    stateRequestFallback = null;
}

function applyControlValue(command, rawValue) {
    const field = CONTROL_FIELDS[command];
    if (!field) {
        return false;
    }
    const value = field.signed && rawValue > 0x7fff ? rawValue - 0x10000 : rawValue;
    currentSettings[field.setting] = clampControlValue(field, value);
    return true;
}

function applyStateFrame(value) {
    if (!value) {
        return false;
    }

    let applied = false;
    if (value.byteLength >= 9 && value.getUint8(0) === STATE_REQUEST_COMMAND) {
        STATE_FIELD_COMMANDS.forEach((command, index) => {
            applied = applyControlValue(command, value.getUint16(1 + index * 2)) || applied;
        });
    } else if (value.byteLength === 3) {
        applied = applyControlValue(value.getUint8(0), value.getUint16(1));
    }

    if (!applied) {
        return false;
    }

    clearStateRequest();
    applyCurrentControlsToUI();
    return true;
}

function handleControlNotification(event) {
    applyStateFrame(event.target.value);
}

async function readDeviceState() {
    if (!stateCharacteristic || !stateCharacteristic.properties.read) {
        return false;
    }

    try {
        return applyStateFrame(await stateCharacteristic.readValue());
    } catch (error) {
        console.warn('State read failed:', error);
        return false;
    }
}

async function enableStateNotifications() {
    if (!stateCharacteristic || !stateCharacteristic.properties) {
        return false;
    }

    const properties = stateCharacteristic.properties;
    if (!properties.notify && !properties.indicate) {
        if (!properties.read) {
            console.warn(
                'State read-back unavailable: the state characteristic needs notify, indicate or read. ' +
                'Its properties are:', properties
            );
        }
        return false;
    }

    stateCharacteristic.addEventListener('characteristicvaluechanged', handleControlNotification);
    try {
        await stateCharacteristic.startNotifications();
        return true;
    } catch (error) {
        console.warn('Notifications unavailable:', error);
        stateCharacteristic.removeEventListener('characteristicvaluechanged', handleControlNotification);
        return false;
    }
}

async function requestDeviceState(onTimeout) {
    if (!controlCharacteristic) {
        if (onTimeout) {
            onTimeout();
        }
        return;
    }

    clearStateRequest();
    stateRequestFallback = onTimeout || null;
    await sendControlValue(STATE_REQUEST_COMMAND, 0);

    if (!notificationsEnabled) {
        stateRequestTimer = setTimeout(async () => {
            stateRequestTimer = null;
            const callback = stateRequestFallback;
            stateRequestFallback = null;
            if (await readDeviceState()) {
                return;
            }
            if (callback) {
                callback();
            }
        }, READ_FALLBACK_DELAY_MS);
        return;
    }

    stateRequestTimer = setTimeout(() => {
        stateRequestTimer = null;
        const callback = stateRequestFallback;
        stateRequestFallback = null;
        if (callback) {
            callback();
        }
    }, STATE_TIMEOUT_MS);
}

async function findStateCharacteristic(service) {
    const canReport = characteristic => Boolean(
        characteristic &&
        characteristic.properties &&
        (characteristic.properties.notify || characteristic.properties.indicate || characteristic.properties.read)
    );

    let dedicated = null;
    try {
        dedicated = await service.getCharacteristic(STATE_CHARACTERISTIC_UUID);
    } catch (error) {
        dedicated = null;
    }

    if (canReport(dedicated)) {
        console.info('Using dedicated state characteristic');
        return dedicated;
    }
    if (canReport(controlCharacteristic)) {
        console.info('No dedicated state characteristic, using the control characteristic');
        return controlCharacteristic;
    }
    console.warn('Neither characteristic can report state (need notify, indicate or read)');
    return dedicated || controlCharacteristic;
}

async function connectBLE() {
    const statusText = document.getElementById('status');
    statusText.innerText = 'Scanning...';

    try {
        bleDevice = await navigator.bluetooth.requestDevice({
            filters: [{ name: 'Cells-Remote' }],
            optionalServices: [SERVICE_UUID]
        });

        statusText.innerText = 'Device: Connecting...';
        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        controlCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
        stateCharacteristic = await findStateCharacteristic(service);
        notificationsEnabled = await enableStateNotifications();
        console.log('Control characteristic properties:', controlCharacteristic.properties);
        console.log('State characteristic properties:', stateCharacteristic && stateCharacteristic.properties);

        statusText.innerText = 'Device: Connected!';
        document.getElementById('connectBtn').style.backgroundColor = '#34c759';
        document.getElementById('connectBtn').innerText = 'Connected';
        setControlState(true);
        applyCurrentControlsToUI();
        await requestDeviceState(() => sendAllSettings());
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
    } catch (error) {
        console.error(error);
        statusText.innerText = `Device: Connection Failed [${error}]`;
    }
}

async function disconnectBLE() {
    if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
    } else {
        onDisconnected();
    }
}

function onDisconnected() {
    document.getElementById('status').innerText = 'Device: Disconnected';
    document.getElementById('connectBtn').style.backgroundColor = '#007aff';
    document.getElementById('connectBtn').innerText = 'Connect';
    clearStateRequest();
    if (stateCharacteristic) {
        stateCharacteristic.removeEventListener('characteristicvaluechanged', handleControlNotification);
    }
    notificationsEnabled = false;
    stateCharacteristic = null;
    controlCharacteristic = null;
    setControlState(false);
}

async function sendAllSettings() {
    await sendControlValue(0x41, currentSettings.feedRate);
    await sendControlValue(0x42, currentSettings.killRate);
    await sendControlValue(0x43, currentSettings.spawnChance);
    if (currentSettings.preset >= 0) {
        await sendControlValue(0x44, currentSettings.preset);
    }
}

async function setRate(rateKey, rawValue) {
    const rate = RATE_CONFIG[rateKey];
    const value = Math.max(rate.min, Math.min(rate.max, Math.round(Number(rawValue) || 0)));
    const changed = value !== currentSettings[rate.setting];
    currentSettings[rate.setting] = value;
    document.getElementById(rate.inputId).value = formatPercent(value);
    if (changed) {
        clearPresetSelection();
        await sendControlValue(rate.command, value);
    }
}

function stepRate(rateKey, deltaPercent) {
    const rate = RATE_CONFIG[rateKey];
    const delta = Math.round(Number(deltaPercent) * 100);
    return setRate(rateKey, currentSettings[rate.setting] + delta);
}

function commitRateInput(rateKey) {
    const rate = RATE_CONFIG[rateKey];
    const input = document.getElementById(rate.inputId);
    const parsed = parsePercent(input.value);
    if (Number.isNaN(parsed)) {
        input.value = formatPercent(currentSettings[rate.setting]);
        return;
    }
    return setRate(rateKey, parsed);
}

async function clearDevice() {
    await sendControlValue(0x45, 0);
}

async function updateSpawnChance(val) {
    const value = Number(val);
    currentSettings.spawnChance = value;
    await sendControlValue(0x43, value);
}

async function updatePreset(val) {
    if (val === '' || val === null || val === undefined) {
        return;
    }
    const value = Number(val);
    if (!Number.isInteger(value) || value < 0) {
        return;
    }
    currentSettings.preset = value;
    await sendControlValue(0x44, value);
    await requestDeviceState();
}

document.querySelectorAll('.step-btn').forEach(button => {
    button.addEventListener('click', () => {
        stepRate(button.dataset.rate, button.dataset.delta);
    });
});

Object.entries(RATE_CONFIG).forEach(([rateKey, rate]) => {
    const input = document.getElementById(rate.inputId);

    input.addEventListener('change', () => {
        commitRateInput(rateKey);
    });

    input.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
            event.preventDefault();
            input.blur();
        } else if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
            event.preventDefault();
            stepRate(rateKey, event.key === 'ArrowUp' ? 0.01 : -0.01);
        }
    });
});

setControlState(false);
applyCurrentControlsToUI();
</script>
</body>
</html>
