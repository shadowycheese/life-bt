<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cellular Automata</title>
    <style>
        :root {
            --app-width: 420px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .app {
            width: 100%;
            max-width: var(--app-width);
            margin: auto 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
        .app-header {
            padding: 20px 30px 16px;
        }
        .app-header h2 {
            margin: 0 0 16px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        .app-header .btn-row {
            margin-bottom: 10px;
        }
        #status {
            font-size: 12px;
            color: #888888;
            margin: 0;
        }
        .tabs {
            display: flex;
            gap: 4px;
            padding: 4px;
            background-color: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .tab {
            width: auto;
            flex: 1 1 0;
            min-width: 0;
            padding: 10px 6px;
            font-size: 13px;
            font-weight: 600;
            color: #aaaaaa;
            background-color: transparent;
            border-radius: 9px;
            white-space: nowrap;
        }
        .tab:hover:not([aria-selected="true"]) {
            background-color: #2a2a2a;
            color: #ffffff;
        }
        .tab:active { background-color: #333333; }
        .tab[aria-selected="true"] {
            color: #ffffff;
            background-color: #007aff;
        }
        .tab[aria-selected="true"]:active { background-color: #0056b3; }
        .tab:focus-visible {
            outline: 2px solid #0a84ff;
            outline-offset: 2px;
        }
        .tab-panel {
            padding: 26px 30px;
        }
        .tab-panel[hidden] {
            display: none;
        }
        .tab-panel > .control-group:first-child {
            margin-top: 0;
        }
        .placeholder {
            margin: 40px 0;
            font-size: 14px;
            color: #777777;
        }
        .file-info {
            margin: 10px 0 0;
            font-size: 13px;
            color: #aaaaaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .progress {
            width: 100%;
            height: 10px;
            margin: 18px 0 10px;
            background-color: #333333;
            border: 1px solid #444444;
            border-radius: 6px;
            overflow: hidden;
            box-sizing: border-box;
        }
        .progress[hidden] {
            display: none;
        }
        .progress-bar {
            display: block;
            width: 0;
            height: 100%;
            background-color: #007aff;
            border-radius: 5px;
            transition: width 0.15s linear;
        }
        .upload-status {
            min-height: 18px;
            margin: 0 0 18px;
            font-size: 13px;
            color: #aaaaaa;
        }
        .upload-status.error {
            color: #ff6b6b;
        }
        .select-mode-btn {
            margin-top: 20px;
        }
        #tab-gif .select-mode-btn {
            margin-top: 0;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, opacity 0.2s;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        button:active { background-color: #0056b3; }
        .btn-secondary {
            background-color: #333333;
        }
        .btn-secondary:active { background-color: #444444; }
        .pad {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 1;
            box-sizing: border-box;
            background-color: #333333;
            background-image:
                repeating-linear-gradient(to right, rgba(255, 255, 255, 0.07) 0 1px, transparent 1px 12.5%),
                repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.07) 0 1px, transparent 1px 25%);
            border: 1px solid #444444;
            border-radius: 8px;
            overflow: hidden;
            cursor: crosshair;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .pad.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        .pad-marker {
            position: absolute;
            width: 8px;
            height: 8px;
            margin: -4px 0 0 -4px;
            border-radius: 50%;
            background-color: #007aff;
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.35);
            pointer-events: none;
        }
        .control-group {
            margin: 25px 0;
            text-align: left;
        }
        label {
            display: block;
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 8px;
        }
        .rate-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .step-btn {
            width: auto;
            flex: 0 0 auto;
            padding: 8px 5px;
            font-size: 11px;
            font-weight: 600;
            line-height: 1;
            background-color: #333333;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .step-btn:active { background-color: #444444; }
        .rate-field {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            min-width: 0;
            background-color: #333333;
            border: 1px solid #444444;
            border-radius: 8px;
            padding: 0 8px;
        }
        .rate-field:focus-within {
            border-color: #007aff;
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
        }
        .rate-field input {
            flex: 1 1 auto;
            min-width: 0;
            width: 100%;
            padding: 9px 0;
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
            background: transparent;
            border: none;
            outline: none;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .rate-field input:disabled { color: #777777; }
        .rate-field .unit {
            padding-left: 4px;
            font-size: 13px;
            color: #888888;
        }
        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 500;
            color: #ffffff;
            background-color: #333333;
            border: 1px solid #444444;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }
        select:focus {
            border-color: #007aff;
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
        }
    </style>
</head>
<body>

<div class="app">
    <header class="card app-header">
        <h2>Cellular Automata</h2>

        <div class="btn-row">
            <button id="connectBtn">Connect</button>
            <button id="disconnectBtn" class="btn-secondary" disabled>Disconnect</button>
        </div>

        <p id="status">Device: Disconnected</p>
    </header>

    <div class="tabs" role="tablist" aria-label="Mode">
        <button type="button" class="tab" role="tab" id="tabBtn-simulation" data-tab="simulation"
                aria-selected="true" aria-controls="tab-simulation">Simulation</button>
        <button type="button" class="tab" role="tab" id="tabBtn-gif" data-tab="gif"
                aria-selected="false" aria-controls="tab-gif" tabindex="-1">GIF Playback</button>
        <button type="button" class="tab" role="tab" id="tabBtn-mandelbrot" data-tab="mandelbrot"
                aria-selected="false" aria-controls="tab-mandelbrot" tabindex="-1">Mandelbrot</button>
    </div>

    <section class="card tab-panel" id="tab-simulation" role="tabpanel" aria-labelledby="tabBtn-simulation">
        <div class="control-group">
            <label id="presetLabel">Preset:</label>
            <select id="presetDropdown" disabled>
                <option value="" hidden>Custom</option>
                <option value="0">Mitosos</option>
                <option value="1">Coral</option>
                <option value="2">Fingerpr.</option>
                <option value="3">Spiral</option>
                <option value="4">Worm</option>
                <option value="5">Maze</option>
                <option value="6">Bubbles</option>
                <option value="7">Spot/Loop</option>
                <option value="8">Waves</option>
                <option value="9">Splotch</option>
                <option value="10">Solition</option>
                <option value="11">Dot</option>
                <option value="12">Stripe</option>
                <option value="13">X/Wave</option>
                <option value="14">Mixed</option>
            </select>
        </div>

        <div class="control-group">
            <label id="spawnChanceLabel">Spawn Chance</label>
            <select id="spawnChanceDropdown" disabled>
                <option value="0">Never</option>
                <option value="1">0.01%</option>
                <option value="10">0.10%</option>
                <option value="20">0.20%</option>
                <option value="25">0.25%</option>
                <option value="50">0.50%</option>
                <option value="75">0.75%</option>
                <option value="100">1.00%</option>
                <option value="150">1.50%</option>
                <option value="200">2.00%</option>
                <option value="250">2.50%</option>
                <option value="300">3.00%</option>
                <option value="500">5.00%</option>
                <option value="750">7.50%</option>
                <option value="1000">10.00%</option>
                <option value="1250">12.50%</option>
                <option value="1500">15.00%</option>
                <option value="1750">17.50%</option>
                <option value="2000">20.00%</option>
                <option value="2500">25.00%</option>
                <option value="3000">30.00%</option>
                <option value="3500">35.00%</option>
                <option value="4000">40.00%</option>
                <option value="4500">45.00%</option>
                <option value="5000">50.00%</option>
            </select>
        </div>

        <div class="control-group">
            <label>Feed Rate</label>
            <div class="rate-row">
                <button type="button" class="step-btn" data-rate="feed" data-delta="-0.10" disabled>−0.10</button>
                <button type="button" class="step-btn" data-rate="feed" data-delta="-0.01" disabled>−0.01</button>
                <span class="rate-field">
                    <input type="text" id="feedRateInput" inputmode="decimal" value="0.32" disabled>
                    <span class="unit">%</span>
                </span>
                <button type="button" class="step-btn" data-rate="feed" data-delta="0.01" disabled>+0.01</button>
                <button type="button" class="step-btn" data-rate="feed" data-delta="0.10" disabled>+0.10</button>
            </div>
        </div>

        <div class="control-group">
            <label>Kill Rate</label>
            <div class="rate-row">
                <button type="button" class="step-btn" data-rate="kill" data-delta="-0.10" disabled>−0.10</button>
                <button type="button" class="step-btn" data-rate="kill" data-delta="-0.01" disabled>−0.01</button>
                <span class="rate-field">
                    <input type="text" id="killRateInput" inputmode="decimal" value="0.32" disabled>
                    <span class="unit">%</span>
                </span>
                <button type="button" class="step-btn" data-rate="kill" data-delta="0.01" disabled>+0.01</button>
                <button type="button" class="step-btn" data-rate="kill" data-delta="0.10" disabled>+0.10</button>
            </div>
        </div>

        <div class="btn-row">
            <button id="clearBtn" class="btn-secondary" disabled>Clear</button>
            <button id="cycleBtn" class="btn-secondary" disabled>Cycle</button>
        </div>

        <div class="pad disabled" id="touchPad" aria-label="Grid position" aria-disabled="true">
            <span class="pad-marker" id="padMarker" hidden></span>
        </div>

        <button type="button" class="select-mode-btn" data-mode="0" disabled>Select Mode</button>
    </section>

    <section class="card tab-panel" id="tab-gif" role="tabpanel" aria-labelledby="tabBtn-gif" hidden>
        <div class="control-group">
            <label id="gifFileLabel" for="gifFileInput">GIF File</label>
            <input type="file" id="gifFileInput" accept="image/gif,.gif" hidden>
            <button type="button" id="gifChooseBtn" class="btn-secondary">Choose GIF…</button>
            <p class="file-info" id="gifFileInfo">No file selected</p>
        </div>

        <div class="progress" id="gifProgress" role="progressbar" aria-label="Upload progress"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
            <span class="progress-bar" id="gifProgressBar"></span>
        </div>

        <p class="upload-status" id="gifStatus" aria-live="polite">Choose a GIF file to upload (max 1 MiB).</p>

        <div class="btn-row">
            <button id="gifStartBtn" disabled>Start Upload</button>
            <button id="gifCancelBtn" class="btn-secondary" disabled>Cancel</button>
        </div>

        <button type="button" class="select-mode-btn" data-mode="1" disabled>Select Mode</button>
    </section>

    <section class="card tab-panel" id="tab-mandelbrot" role="tabpanel" aria-labelledby="tabBtn-mandelbrot" hidden>
        <p class="placeholder">Coming soon</p>
        <button type="button" class="select-mode-btn" data-mode="2" disabled>Select Mode</button>
    </section>
</div>

<script>
/* ==========================================================================
 * Shared Bluetooth link (available to every tab)
 *
 * Control protocol (all 16-bit values big-endian, high byte first)
 *
 * Browser -> device, write (3 bytes): [command, hi, lo]
 *   0x41  feed rate     percent * 100   (1..10000, i.e. 0.01%..10.00%)
 *   0x42  kill rate     percent * 100   (0..10000)
 *   0x43  spawn chance  percent * 100   (0..5000)
 *   0x44  preset index                  (0..14)
 *   0x40  request full state; hi/lo ignored (sent as 0x00 0x00)
 *   0x45  clear the display; hi/lo ignored (sent as 0x00 0x00)
 *   0x46  pad position: [0x46, x, y]    x 0..63, y 0..31
 *   0x47  cycle the display; hi/lo ignored (sent as 0x00 0x00)
 *   0x7E  select mode: [0x7E, mode]     0 simulation, 1 GIF playback,
 *                                       2 Mandelbrot; no response expected
 *
 * GIF upload (GIF playback tab; big-endian, replies are notifications):
 *   0x50  start:    [0x50, size(4), name(32)]   size in bytes, name is ASCII,
 *                   NUL padded/terminated
 *         reply:    [0x50, status, maxChunk(2), window]   status 0 = accepted;
 *                   maxChunk is file bytes per chunk (MTU 517 allows at most
 *                   511, since the chunk frame has a 3-byte header);
 *                   a 2-byte [0x50, 0x00] means 250 bytes, window 1
 *   0x51  chunk:    [0x51, seq(2), data...]     seq starts at 0
 *         reply:    [0x51, seq(2), status]
 *   0x54  finish:   [0x54, crc16(2)]            CRC-16/CCITT-FALSE of the file
 *         reply:    [0x53, status, deviceCrc(2)?]  deviceCrc present on error
 *   0x53  abort:    [0x53]                      reply: [0x52, status]
 *
 * The host sends up to `window` chunks without waiting for their acks and
 * resends unacked chunks after a timeout; the device writes chunk n at
 * offset n * maxChunk, so a resend is idempotent.
 *
 * Device -> browser, notify (9 bytes):
 *   [0x40, feedHi, feedLo, killHi, killLo, spawnHi, spawnLo, presetHi, presetLo]
 *
 * In the state reply, preset 0xFFFF (-1 as int16) means "custom": the feed or
 * kill rate was edited by hand, so no preset is selected.
 *
 * The device may also notify a single 3-byte frame with the same layout as a
 * write (0x41..0x44) to push one changed value; the browser applies both.
 * If the characteristic has no notify/indicate property, the browser sends
 * 0x40 and then reads the characteristic once to get the same 9-byte frame.
 * ========================================================================== */

const ble = (() => {
    const SERVICE_UUID = '41424344-4546-4748-494a-4b4c4d4e4f50';
    const CHARACTERISTIC_UUID = '51525354-5556-5758-595a-5b5c5d5e5f60';

    /*
     * Optional dedicated characteristic for state replies. It must have the
     * notify (or indicate, or read) property; the control characteristic above
     * is write-only and cannot send data back. If the device does not expose
     * it, the browser falls back to using the control characteristic when that
     * one can notify or be read.
     */
    const STATE_CHARACTERISTIC_UUID = '51525354-5556-5758-595a-5b5c5d5e5f61';

    const STATE_REQUEST_COMMAND = 0x40;
    const STATE_TIMEOUT_MS = 1500;
    const READ_FALLBACK_DELAY_MS = 250;

    let device = null;
    let controlCharacteristic = null;
    let stateCharacteristic = null;
    let notificationsEnabled = false;
    let requestTimer = null;
    let requestFallback = null;
    let connecting = false;

    /*
     * connected    one argument: none; fired once the characteristics are ready
     * disconnected none; fired after the link has been torn down
     * frame        one argument: a DataView; return true to consume the frame
     */
    const listeners = {
        connected: [],
        disconnected: [],
        frame: []
    };

    function on(event, handler) {
        if (Array.isArray(listeners[event])) {
            listeners[event].push(handler);
        }
    }

    function emit(event) {
        listeners[event].forEach(handler => {
            try {
                handler();
            } catch (error) {
                console.error(error);
            }
        });
    }

    function hasControl() {
        return Boolean(controlCharacteristic);
    }

    async function sendBytes(bytes) {
        if (!controlCharacteristic) {
            return false;
        }

        const data = new Uint8Array(bytes);

        try {
            if (controlCharacteristic.properties && controlCharacteristic.properties.writeWithoutResponse) {
                await controlCharacteristic.writeValueWithoutResponse(data);
            } else {
                await controlCharacteristic.writeValue(data);
            }
            return true;
        } catch (error) {
            console.error('Write error:', error);
            return false;
        }
    }

    async function send(command, value) {
        const safeValue = Math.max(0, Math.min(65535, Number(value) || 0));
        const high = Math.floor(safeValue / 256);
        const low = safeValue % 256;
        return sendBytes([command, high, low]);
    }

    function clearRequest() {
        if (requestTimer !== null) {
            clearTimeout(requestTimer);
            requestTimer = null;
        }
        requestFallback = null;
    }

    function dispatchFrame(view) {
        if (!view) {
            return false;
        }

        let consumed = false;
        listeners.frame.forEach(handler => {
            try {
                if (handler(view)) {
                    consumed = true;
                }
            } catch (error) {
                console.error(error);
            }
        });

        if (consumed) {
            clearRequest();
        }
        return consumed;
    }

    function handleNotification(event) {
        dispatchFrame(event.target.value);
    }

    async function readDeviceState() {
        if (!stateCharacteristic || !stateCharacteristic.properties.read) {
            return false;
        }

        try {
            return dispatchFrame(await stateCharacteristic.readValue());
        } catch (error) {
            console.warn('State read failed:', error);
            return false;
        }
    }

    async function enableStateNotifications() {
        if (!stateCharacteristic || !stateCharacteristic.properties) {
            return false;
        }

        const properties = stateCharacteristic.properties;
        if (!properties.notify && !properties.indicate) {
            if (!properties.read) {
                console.warn(
                    'State read-back unavailable: the state characteristic needs notify, indicate or read. ' +
                    'Its properties are:', properties
                );
            }
            return false;
        }

        stateCharacteristic.addEventListener('characteristicvaluechanged', handleNotification);
        try {
            await stateCharacteristic.startNotifications();
            return true;
        } catch (error) {
            console.warn('Notifications unavailable:', error);
            stateCharacteristic.removeEventListener('characteristicvaluechanged', handleNotification);
            return false;
        }
    }

    async function requestState(onTimeout) {
        if (!controlCharacteristic) {
            if (onTimeout) {
                onTimeout();
            }
            return;
        }

        clearRequest();
        requestFallback = onTimeout || null;
        await send(STATE_REQUEST_COMMAND, 0);

        if (!notificationsEnabled) {
            requestTimer = setTimeout(async () => {
                requestTimer = null;
                const callback = requestFallback;
                requestFallback = null;
                if (await readDeviceState()) {
                    return;
                }
                if (callback) {
                    callback();
                }
            }, READ_FALLBACK_DELAY_MS);
            return;
        }

        requestTimer = setTimeout(() => {
            requestTimer = null;
            const callback = requestFallback;
            requestFallback = null;
            if (callback) {
                callback();
            }
        }, STATE_TIMEOUT_MS);
    }

    async function findStateCharacteristic(service) {
        const canReport = characteristic => Boolean(
            characteristic &&
            characteristic.properties &&
            (characteristic.properties.notify || characteristic.properties.indicate || characteristic.properties.read)
        );

        let dedicated = null;
        try {
            dedicated = await service.getCharacteristic(STATE_CHARACTERISTIC_UUID);
        } catch (error) {
            dedicated = null;
        }

        if (canReport(dedicated)) {
            console.info('Using dedicated state characteristic');
            return dedicated;
        }
        if (canReport(controlCharacteristic)) {
            console.info('No dedicated state characteristic, using the control characteristic');
            return controlCharacteristic;
        }
        console.warn('Neither characteristic can report state (need notify, indicate or read)');
        return dedicated || controlCharacteristic;
    }

    function setStatus(text) {
        document.getElementById('status').innerText = text;
    }

    function setConnectionState(connected) {
        const connectBtn = document.getElementById('connectBtn');
        connectBtn.disabled = connected || connecting;
        connectBtn.style.backgroundColor = connected ? '#34c759' : '#007aff';
        connectBtn.innerText = connected ? 'Connected' : 'Connect';
        document.getElementById('disconnectBtn').disabled = !connected;
    }

    function resetLink() {
        if (!device && !controlCharacteristic && !stateCharacteristic) {
            return;
        }

        if (stateCharacteristic) {
            stateCharacteristic.removeEventListener('characteristicvaluechanged', handleNotification);
        }
        clearRequest();
        notificationsEnabled = false;
        stateCharacteristic = null;
        controlCharacteristic = null;
        device = null;

        setStatus('Device: Disconnected');
        setConnectionState(false);
        emit('disconnected');
    }

    async function connect() {
        if (connecting || (device && device.gatt && device.gatt.connected)) {
            return;
        }

        connecting = true;
        setConnectionState(false);
        setStatus('Scanning...');

        try {
            device = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'Cells-Remote' }],
                optionalServices: [SERVICE_UUID]
            });

            setStatus('Device: Connecting...');
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            controlCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
            stateCharacteristic = await findStateCharacteristic(service);
            notificationsEnabled = await enableStateNotifications();
            console.log('Control characteristic properties:', controlCharacteristic.properties);
            console.log('State characteristic properties:', stateCharacteristic && stateCharacteristic.properties);

            device.addEventListener('gattserverdisconnected', resetLink);
            setStatus('Device: Connected!');
            setConnectionState(true);
            emit('connected');
        } catch (error) {
            console.error(error);
            setStatus(`Device: Connection Failed [${error}]`);

            try {
                if (device && device.gatt && device.gatt.connected) {
                    device.gatt.disconnect();
                }
            } catch (disconnectError) {
                console.warn('Cleanup disconnect failed:', disconnectError);
            }

            notificationsEnabled = false;
            stateCharacteristic = null;
            controlCharacteristic = null;
            device = null;
        } finally {
            connecting = false;
            setConnectionState(Boolean(device && device.gatt && device.gatt.connected));
        }
    }

    async function disconnect() {
        try {
            if (device && device.gatt && device.gatt.connected) {
                device.gatt.disconnect();
            }
        } catch (error) {
            console.warn('Disconnect failed:', error);
        } finally {
            resetLink();
        }
    }

    function init() {
        document.getElementById('connectBtn').addEventListener('click', connect);
        document.getElementById('disconnectBtn').addEventListener('click', disconnect);
        setConnectionState(false);
    }

    return { init, on, send, sendBytes, requestState, hasControl };
})();

/* ==========================================================================
 * Simulation tab
 *
 * Owns the device settings, the controls that drive them and the touch pad.
 * The 9-byte state reply and the 3-byte value pushes are decoded here because
 * they all describe simulation settings.
 * ========================================================================== */

const simulation = (() => {
    const DEFAULT_SETTINGS = {
        feedRate: 32,
        killRate: 32,
        spawnChance: 100,
        preset: 0
    };

    const currentSettings = { ...DEFAULT_SETTINGS };

    const STATE_REPLY_COMMAND = 0x40;
    const PAD_COMMAND = 0x46;
    const PAD_COLUMNS = 64;
    const PAD_ROWS = 32;

    const RATE_CONFIG = {
        feed: {
            inputId: 'feedRateInput',
            setting: 'feedRate',
            command: 0x41,
            min: 1,
            max: 10000
        },
        kill: {
            inputId: 'killRateInput',
            setting: 'killRate',
            command: 0x42,
            min: 0,
            max: 10000
        }
    };

    const CONTROL_FIELDS = {
        0x41: RATE_CONFIG.feed,
        0x42: RATE_CONFIG.kill,
        0x43: { setting: 'spawnChance', min: 0, max: 5000 },
        0x44: { setting: 'preset', min: -1, max: 14, signed: true }
    };

    const STATE_FIELD_COMMANDS = [0x41, 0x42, 0x43, 0x44];

    const $ = id => document.getElementById(id);

    function formatPercent(rawValue) {
        const value = Number(rawValue) || 0;
        return (value / 100).toFixed(2);
    }

    function parsePercent(text) {
        const cleaned = String(text).replace(/%/g, '').replace(/\s/g, '').replace(',', '.');
        if (cleaned === '') {
            return NaN;
        }
        const value = Number(cleaned);
        return Number.isFinite(value) ? Math.round(value * 100) : NaN;
    }

    function setControlState(connected) {
        const controls = [
            $('feedRateInput'),
            $('killRateInput'),
            $('spawnChanceDropdown'),
            $('presetDropdown')
        ];

        controls.forEach(control => {
            control.disabled = !connected;
        });

        document.querySelectorAll('#tab-simulation .step-btn').forEach(button => {
            button.disabled = !connected;
        });

        $('clearBtn').disabled = !connected;
        $('cycleBtn').disabled = !connected;

        const pad = $('touchPad');
        pad.classList.toggle('disabled', !connected);
        pad.setAttribute('aria-disabled', String(!connected));
    }

    function setSpawnChanceOption(value) {
        const dropdown = $('spawnChanceDropdown');
        const raw = String(value);
        const match = Array.from(dropdown.options).find(option => option.value === raw);
        const dynamic = dropdown.querySelector('option[data-dynamic]');

        if (match) {
            if (dynamic) {
                dynamic.remove();
            }
        } else {
            const option = dynamic || document.createElement('option');
            if (!dynamic) {
                option.dataset.dynamic = 'true';
                dropdown.appendChild(option);
            }
            option.value = raw;
            option.textContent = `${(value / 100).toFixed(2)}%`;
        }

        dropdown.value = raw;
    }

    function applyCurrentControlsToUI() {
        Object.values(RATE_CONFIG).forEach(rate => {
            const input = $(rate.inputId);
            if (document.activeElement === input) {
                return;
            }
            input.value = formatPercent(currentSettings[rate.setting]);
        });
        setSpawnChanceOption(currentSettings.spawnChance);

        const presetDropdown = $('presetDropdown');
        presetDropdown.value = currentSettings.preset < 0 ? '' : String(currentSettings.preset);
    }

    function clearPresetSelection() {
        currentSettings.preset = -1;
        $('presetDropdown').value = '';
    }

    function clampControlValue(field, value) {
        return Math.max(field.min, Math.min(field.max, Math.round(Number(value) || 0)));
    }

    function applyControlValue(command, rawValue) {
        const field = CONTROL_FIELDS[command];
        if (!field) {
            return false;
        }
        const value = field.signed && rawValue > 0x7fff ? rawValue - 0x10000 : rawValue;
        currentSettings[field.setting] = clampControlValue(field, value);
        return true;
    }

    function applyStateFrame(view) {
        if (!view) {
            return false;
        }

        let applied = false;
        if (view.byteLength >= 9 && view.getUint8(0) === STATE_REPLY_COMMAND) {
            STATE_FIELD_COMMANDS.forEach((command, index) => {
                applied = applyControlValue(command, view.getUint16(1 + index * 2)) || applied;
            });
        } else if (view.byteLength === 3) {
            applied = applyControlValue(view.getUint8(0), view.getUint16(1));
        }

        if (!applied) {
            return false;
        }

        applyCurrentControlsToUI();
        return true;
    }

    async function sendAllSettings() {
        await ble.send(0x41, currentSettings.feedRate);
        await ble.send(0x42, currentSettings.killRate);
        await ble.send(0x43, currentSettings.spawnChance);
        if (currentSettings.preset >= 0) {
            await ble.send(0x44, currentSettings.preset);
        }
    }

    async function setRate(rateKey, rawValue) {
        const rate = RATE_CONFIG[rateKey];
        const value = Math.max(rate.min, Math.min(rate.max, Math.round(Number(rawValue) || 0)));
        const changed = value !== currentSettings[rate.setting];
        currentSettings[rate.setting] = value;
        $(rate.inputId).value = formatPercent(value);
        if (changed) {
            clearPresetSelection();
            await ble.send(rate.command, value);
        }
    }

    function stepRate(rateKey, deltaPercent) {
        const rate = RATE_CONFIG[rateKey];
        const delta = Math.round(Number(deltaPercent) * 100);
        return setRate(rateKey, currentSettings[rate.setting] + delta);
    }

    function commitRateInput(rateKey) {
        const rate = RATE_CONFIG[rateKey];
        const input = $(rate.inputId);
        const parsed = parsePercent(input.value);
        if (Number.isNaN(parsed)) {
            input.value = formatPercent(currentSettings[rate.setting]);
            return;
        }
        return setRate(rateKey, parsed);
    }

    function sendPadPosition(event) {
        if (!ble.hasControl()) {
            return;
        }
        if (typeof event.button === 'number' && event.button !== 0) {
            return;
        }

        const pad = $('touchPad');
        const rect = pad.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) {
            return;
        }

        const x = Math.max(0, Math.min(PAD_COLUMNS - 1,
            Math.floor((event.clientX - rect.left) / rect.width * PAD_COLUMNS)));
        const y = Math.max(0, Math.min(PAD_ROWS - 1,
            Math.floor((event.clientY - rect.top) / rect.height * PAD_ROWS)));

        const marker = $('padMarker');
        marker.hidden = false;
        marker.style.left = `${((x + 0.5) / PAD_COLUMNS) * 100}%`;
        marker.style.top = `${((y + 0.5) / PAD_ROWS) * 100}%`;

        ble.send(PAD_COMMAND, (x << 8) | y);
    }

    async function clearDevice() {
        await ble.send(0x45, 0);
    }

    async function cycleDevice() {
        await ble.send(0x47, 0);
    }

    async function updateSpawnChance(val) {
        const value = Number(val);
        currentSettings.spawnChance = value;
        await ble.send(0x43, value);
    }

    async function updatePreset(val) {
        if (val === '' || val === null || val === undefined) {
            return;
        }
        const value = Number(val);
        if (!Number.isInteger(value) || value < 0) {
            return;
        }
        currentSettings.preset = value;
        await ble.send(0x44, value);
        await ble.requestState();
    }

    async function handleConnected() {
        setControlState(true);
        applyCurrentControlsToUI();
        await ble.requestState(() => sendAllSettings());
    }

    function handleDisconnected() {
        $('padMarker').hidden = true;
        setControlState(false);
    }

    function init() {
        $('touchPad').addEventListener('pointerdown', sendPadPosition);

        document.querySelectorAll('#tab-simulation .step-btn').forEach(button => {
            button.addEventListener('click', () => {
                stepRate(button.dataset.rate, button.dataset.delta);
            });
        });

        Object.entries(RATE_CONFIG).forEach(([rateKey, rate]) => {
            const input = $(rate.inputId);

            input.addEventListener('change', () => {
                commitRateInput(rateKey);
            });

            input.addEventListener('keydown', event => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    input.blur();
                } else if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
                    event.preventDefault();
                    stepRate(rateKey, event.key === 'ArrowUp' ? 0.01 : -0.01);
                }
            });
        });

        $('presetDropdown').addEventListener('change', event => updatePreset(event.target.value));
        $('spawnChanceDropdown').addEventListener('change', event => updateSpawnChance(event.target.value));
        $('clearBtn').addEventListener('click', clearDevice);
        $('cycleBtn').addEventListener('click', cycleDevice);

        ble.on('connected', handleConnected);
        ble.on('disconnected', handleDisconnected);
        ble.on('frame', applyStateFrame);

        setControlState(false);
        applyCurrentControlsToUI();
    }

    return { init };
})();

/* ==========================================================================
 * Tabs
 *
 * Panels live in the DOM at all times, so switching tabs never disturbs the
 * Bluetooth link. A tabshown event is dispatched for views that need to size
 * or start something only when visible.
 * ========================================================================== */

const tabs = (() => {
    const DEFAULT_TAB = 'simulation';
    const buttons = Array.from(document.querySelectorAll('.tab'));
    const panels = Array.from(document.querySelectorAll('.tab-panel'));
    const names = buttons.map(button => button.dataset.tab);
    const tablist = document.querySelector('.tabs');

    let current = null;

    function show(name, updateHash) {
        if (!names.includes(name)) {
            name = DEFAULT_TAB;
        }

        if (current === name) {
            if (updateHash && location.hash !== `#${name}`) {
                location.hash = name;
            }
            return;
        }
        current = name;

        buttons.forEach(button => {
            const selected = button.dataset.tab === name;
            button.setAttribute('aria-selected', String(selected));
            button.tabIndex = selected ? 0 : -1;
        });

        panels.forEach(panel => {
            panel.hidden = panel.id !== `tab-${name}`;
        });

        if (updateHash && location.hash !== `#${name}`) {
            location.hash = name;
        }

        document.dispatchEvent(new CustomEvent('tabshown', { detail: { tab: name } }));
    }

    function init() {
        buttons.forEach(button => {
            button.addEventListener('click', () => show(button.dataset.tab, true));
        });

        tablist.addEventListener('keydown', event => {
            const index = buttons.indexOf(document.activeElement);
            if (index === -1) {
                return;
            }

            let next = index;
            if (event.key === 'ArrowRight') {
                next = (index + 1) % buttons.length;
            } else if (event.key === 'ArrowLeft') {
                next = (index - 1 + buttons.length) % buttons.length;
            } else if (event.key === 'Home') {
                next = 0;
            } else if (event.key === 'End') {
                next = buttons.length - 1;
            } else {
                return;
            }

            event.preventDefault();
            buttons[next].focus();
            show(buttons[next].dataset.tab, true);
        });

        window.addEventListener('hashchange', () => {
            const name = location.hash.slice(1);
            show(name, false);
            if (!names.includes(name)) {
                history.replaceState(null, '', `#${current}`);
            }
        });

        const initial = location.hash.slice(1);
        if (names.includes(initial)) {
            show(initial, false);
        } else {
            show(DEFAULT_TAB, false);
            history.replaceState(null, '', `#${DEFAULT_TAB}`);
        }
    }

    return { init, show };
})();

/* ==========================================================================
 * Mode selection (available on every tab)
 *
 * Fire-and-forget: [0x7E, mode] where mode is 0 simulation, 1 GIF playback,
 * 2 Mandelbrot. The device does not reply.
 * ========================================================================== */

const modeSelector = (() => {
    const MODE_COMMAND = 0x7E;
    const buttons = Array.from(document.querySelectorAll('.select-mode-btn'));

    let connected = false;
    let uploading = false;

    function refresh() {
        const disabled = !connected || uploading;
        buttons.forEach(button => {
            button.disabled = disabled;
        });
    }

    function setConnected(value) {
        connected = value;
        refresh();
    }

    function setUploading(value) {
        uploading = value;
        refresh();
    }

    async function selectMode(event) {
        const mode = Number(event.currentTarget.dataset.mode);
        if (!Number.isInteger(mode)) {
            return;
        }
        await ble.sendBytes([MODE_COMMAND, mode]);
    }

    function init() {
        buttons.forEach(button => {
            button.addEventListener('click', selectMode);
        });

        ble.on('connected', () => setConnected(true));
        ble.on('disconnected', () => setConnected(false));
        setConnected(false);
    }

    return { init, setUploading };
})();

/* ==========================================================================
 * GIF upload (GIF playback tab)
 *
 * See the protocol description above the ble module. Chunks may be in flight
 * up to the window advertised by the device; every chunk is acked and any
 * chunk that goes unanswered for 2 s is resent (the device writes chunk n at
 * offset n * maxChunk, so resends are idempotent).
 * ========================================================================== */

const gifUpload = (() => {
    const START_COMMAND = 0x50;
    const CHUNK_COMMAND = 0x51;
    const COMPLETE_COMMAND = 0x54;
    const ABORT_COMMAND = 0x53;

    const START_ACK = 0x50;
    const CHUNK_ACK = 0x51;
    const ABORT_ACK = 0x52;
    const COMPLETE_ACK = 0x53;

    const MAX_FILE_BYTES = 1024 * 1024;
    const MIN_CHUNK_BYTES = 1;
    /* A chunk frame is 3 header bytes + data, so MTU 517 allows 511 data bytes. */
    const MAX_CHUNK_BYTES = 511;
    const DEFAULT_CHUNK_BYTES = 250;
    const DEFAULT_WINDOW = 1;
    const MAX_WINDOW = 32;
    const NAME_BYTES = 32;
    const ACK_TIMEOUT_MS = 2000;
    const MAX_ATTEMPTS = 3;

    const CANCELLED = Symbol('upload cancelled');

    const $ = id => document.getElementById(id);

    let selectedFile = null;
    let fileBytes = null;
    let fileCrc = 0;

    let busy = false;
    let stopRequested = false;
    let stopReason = null;
    let activeTransfer = null;
    let controlWaiter = null;

    let progressFrame = 0;
    let pendingProgress = null;

    function writeUint32BE(target, offset, value) {
        target[offset] = (value >>> 24) & 0xff;
        target[offset + 1] = (value >>> 16) & 0xff;
        target[offset + 2] = (value >>> 8) & 0xff;
        target[offset + 3] = value & 0xff;
    }

    function crc16Ccitt(data) {
        let crc = 0xffff;
        for (let i = 0; i < data.length; i++) {
            crc ^= data[i] << 8;
            for (let bit = 0; bit < 8; bit++) {
                crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xffff : (crc << 1) & 0xffff;
            }
        }
        return crc;
    }

    function clampInt(value, min, max, fallback) {
        const number = Number(value);
        if (!Number.isFinite(number)) {
            return fallback;
        }
        return Math.max(min, Math.min(max, Math.round(number)));
    }

    function buildName(name) {
        let ascii = Array.from(String(name || 'upload.gif')).map(character => {
            const code = character.charCodeAt(0);
            return code >= 32 && code < 127 ? character : '_';
        }).join('') || 'upload.gif';

        if (ascii.length > NAME_BYTES - 1) {
            const suffix = ascii.toLowerCase().endsWith('.gif') ? ascii.slice(-4) : '';
            ascii = ascii.slice(0, NAME_BYTES - 1 - suffix.length) + suffix;
        }

        const out = new Uint8Array(NAME_BYTES);
        for (let i = 0; i < ascii.length; i++) {
            out[i] = ascii.charCodeAt(i) & 0x7f;
        }
        return out;
    }

    function formatBytes(bytes) {
        if (bytes >= 1024 * 1024) {
            return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
        }
        if (bytes >= 1024) {
            return `${(bytes / 1024).toFixed(1)} KB`;
        }
        return `${bytes} B`;
    }

    function setStatus(text, isError) {
        const status = $('gifStatus');
        status.textContent = text;
        status.classList.toggle('error', Boolean(isError));
    }

    function refreshControls() {
        const connected = ble.hasControl();
        $('gifFileInput').disabled = busy;
        $('gifChooseBtn').disabled = busy;
        $('gifStartBtn').disabled = busy || !selectedFile || !connected;
        $('gifCancelBtn').disabled = !busy;
        modeSelector.setUploading(busy);
    }

    function resetProgress() {
        if (progressFrame) {
            cancelAnimationFrame(progressFrame);
            progressFrame = 0;
        }
        pendingProgress = null;
        $('gifProgress').hidden = true;
        $('gifProgressBar').style.width = '0%';
        $('gifProgress').setAttribute('aria-valuenow', '0');
    }

    function paintProgress(done, total) {
        const percent = total > 0 ? Math.min(100, Math.round((done / total) * 100)) : 0;
        $('gifProgressBar').style.width = `${percent}%`;
        $('gifProgress').setAttribute('aria-valuenow', String(percent));
        setStatus(`Uploading… ${percent}% (${done} / ${total} chunks)`);
    }

    function scheduleProgress(done, total) {
        pendingProgress = { done, total };
        if (progressFrame) {
            return;
        }
        progressFrame = requestAnimationFrame(() => {
            progressFrame = 0;
            const pending = pendingProgress;
            pendingProgress = null;
            if (pending) {
                paintProgress(pending.done, pending.total);
            }
        });
    }

    function flushProgress() {
        if (progressFrame) {
            cancelAnimationFrame(progressFrame);
            progressFrame = 0;
        }
        if (pendingProgress) {
            const { done, total } = pendingProgress;
            pendingProgress = null;
            paintProgress(done, total);
        }
    }

    function matchStart(view) {
        if (view.byteLength < 2 || view.getUint8(0) !== START_ACK) {
            return undefined;
        }

        const status = view.getUint8(1);
        if (status !== 0) {
            return { status };
        }
        if (view.byteLength >= 5) {
            return { status, maxChunk: view.getUint16(2), window: view.getUint8(4) };
        }
        if (view.byteLength === 2) {
            return { status, maxChunk: DEFAULT_CHUNK_BYTES, window: DEFAULT_WINDOW };
        }
        return { status: 255 };
    }

    function matchComplete(view) {
        if (view.byteLength < 2 || view.getUint8(0) !== COMPLETE_ACK) {
            return undefined;
        }
        return {
            status: view.getUint8(1),
            deviceCrc: view.byteLength >= 4 ? view.getUint16(2) : null
        };
    }

    function matchAbort(view) {
        if (view.byteLength < 2 || view.getUint8(0) !== ABORT_ACK) {
            return undefined;
        }
        return { status: view.getUint8(1) };
    }

    function waitForControl(match, timeoutMs) {
        return new Promise(resolve => {
            if (controlWaiter) {
                controlWaiter.done(null);
            }

            let timer = null;
            const waiter = {
                match,
                done(value) {
                    if (timer !== null) {
                        clearTimeout(timer);
                        timer = null;
                    }
                    if (controlWaiter === waiter) {
                        controlWaiter = null;
                    }
                    resolve(value);
                }
            };

            controlWaiter = waiter;
            timer = setTimeout(() => waiter.done(null), timeoutMs);
        });
    }

    function waitForWake(transfer, timeoutMs) {
        return new Promise(resolve => {
            let timer = null;
            const done = () => {
                if (timer !== null) {
                    clearTimeout(timer);
                    timer = null;
                }
                if (transfer.wake === done) {
                    transfer.wake = null;
                }
                resolve();
            };
            transfer.wake = done;
            timer = setTimeout(done, timeoutMs);
        });
    }

    function handleFrame(view) {
        if (!view || view.byteLength < 2) {
            return false;
        }

        const command = view.getUint8(0);

        if (activeTransfer && command === CHUNK_ACK && view.byteLength >= 4) {
            const seq = view.getUint16(1);
            const status = view.getUint8(3);
            const state = activeTransfer.pending.get(seq);

            if (state) {
                if (status === 0) {
                    activeTransfer.pending.delete(seq);
                    activeTransfer.acked += 1;
                } else {
                    activeTransfer.error = new Error(`Device rejected chunk ${seq + 1} (status ${status})`);
                }
                if (activeTransfer.wake) {
                    activeTransfer.wake();
                }
            }
            return true;
        }

        if (controlWaiter) {
            const result = controlWaiter.match(view);
            if (result !== undefined) {
                controlWaiter.done(result);
                return true;
            }
        }

        return false;
    }

    async function sendChunk(seq, chunkSize) {
        const offset = seq * chunkSize;
        const length = Math.min(chunkSize, fileBytes.length - offset);
        const frame = new Uint8Array(3 + length);
        frame[0] = CHUNK_COMMAND;
        frame[1] = (seq >>> 8) & 0xff;
        frame[2] = seq & 0xff;
        frame.set(fileBytes.subarray(offset, offset + length), 3);

        if (!(await ble.sendBytes(frame))) {
            throw new Error('Bluetooth write was rejected');
        }
    }

    async function abortTransfer() {
        if (!ble.hasControl()) {
            return;
        }
        const abortAckPromise = waitForControl(matchAbort, ACK_TIMEOUT_MS);
        if (!(await ble.sendBytes([ABORT_COMMAND]))) {
            return;
        }
        await abortAckPromise;
    }

    async function runTransfer() {
        const size = fileBytes.length;
        const name = buildName(selectedFile.name);
        const startFrame = new Uint8Array(5 + NAME_BYTES);
        startFrame[0] = START_COMMAND;
        writeUint32BE(startFrame, 1, size);
        startFrame.set(name, 5);

        /* Listen before writing: a fast device may reply immediately. */
        const startAckPromise = waitForControl(matchStart, ACK_TIMEOUT_MS);
        if (!(await ble.sendBytes(startFrame))) {
            throw new Error('Bluetooth write was rejected');
        }

        const startAck = await startAckPromise;
        if (stopRequested) {
            throw CANCELLED;
        }
        if (!startAck) {
            throw new Error('No reply to the upload start');
        }
        if (startAck.status !== 0) {
            throw new Error(`Device refused the upload (status ${startAck.status})`);
        }

        const chunkSize = startAck.maxChunk > 0
            ? clampInt(startAck.maxChunk, MIN_CHUNK_BYTES, MAX_CHUNK_BYTES, DEFAULT_CHUNK_BYTES)
            : DEFAULT_CHUNK_BYTES;
        const windowSize = startAck.window > 0
            ? clampInt(startAck.window, 1, MAX_WINDOW, DEFAULT_WINDOW)
            : DEFAULT_WINDOW;
        const total = Math.ceil(size / chunkSize);

        const transfer = {
            pending: new Map(),
            acked: 0,
            error: null,
            wake: null
        };
        activeTransfer = transfer;

        $('gifProgress').hidden = false;
        paintProgress(0, total);

        let nextSeq = 0;

        while (nextSeq < total || transfer.pending.size > 0) {
            if (transfer.error) {
                throw transfer.error;
            }
            if (stopRequested) {
                throw CANCELLED;
            }

            while (nextSeq < total && transfer.pending.size < windowSize) {
                const seq = nextSeq;
                /* Register before writing so an immediate ack is not lost. */
                transfer.pending.set(seq, { attempts: 1, sentAt: Date.now() });
                nextSeq += 1;
                await sendChunk(seq, chunkSize);
            }

            if (!transfer.pending.size && nextSeq >= total) {
                break;
            }

            let earliest = Infinity;
            for (const state of transfer.pending.values()) {
                earliest = Math.min(earliest, state.sentAt + ACK_TIMEOUT_MS);
            }

            if (earliest === Infinity) {
                /* Everything in flight was acked while sending; send more. */
                continue;
            }

            await waitForWake(transfer, Math.max(0, earliest - Date.now()));

            if (transfer.error) {
                throw transfer.error;
            }
            if (stopRequested) {
                throw CANCELLED;
            }

            const now = Date.now();
            const expired = [...transfer.pending.keys()]
                .sort((a, b) => a - b)
                .filter(seq => {
                    const state = transfer.pending.get(seq);
                    return state && state.sentAt + ACK_TIMEOUT_MS <= now;
                });

            for (const seq of expired) {
                const state = transfer.pending.get(seq);
                if (!state) {
                    continue;
                }
                state.attempts += 1;
                if (state.attempts > MAX_ATTEMPTS) {
                    throw new Error(`No reply for chunk ${seq + 1} of ${total}`);
                }
                state.sentAt = Date.now();
                await sendChunk(seq, chunkSize);
            }

            scheduleProgress(transfer.acked, total);
        }

        scheduleProgress(transfer.acked, total);
        flushProgress();
        setStatus('Verifying…');

        const completeFrame = new Uint8Array([
            COMPLETE_COMMAND,
            (fileCrc >>> 8) & 0xff,
            fileCrc & 0xff
        ]);

        const completeAckPromise = waitForControl(matchComplete, ACK_TIMEOUT_MS);
        if (!(await ble.sendBytes(completeFrame))) {
            throw new Error('Bluetooth write was rejected');
        }

        const completeAck = await completeAckPromise;
        if (stopRequested) {
            throw CANCELLED;
        }
        if (!completeAck) {
            throw new Error('No reply to upload completion');
        }
        if (completeAck.status !== 0) {
            const crcText = completeAck.deviceCrc === null
                ? ''
                : `, device CRC 0x${completeAck.deviceCrc.toString(16).padStart(4, '0')}`;
            throw new Error(`Upload rejected (status ${completeAck.status}${crcText})`);
        }
    }

    async function startUpload() {
        if (busy || !selectedFile || !fileBytes || !ble.hasControl()) {
            return;
        }

        busy = true;
        stopRequested = false;
        stopReason = null;
        refreshControls();

        $('gifProgress').hidden = false;
        $('gifProgressBar').style.width = '0%';
        setStatus('Starting upload…');

        try {
            await runTransfer();
            flushProgress();
            $('gifProgressBar').style.width = '100%';
            $('gifProgress').setAttribute('aria-valuenow', '100');
            setStatus('Upload complete.');
        } catch (error) {
            flushProgress();
            if (error === CANCELLED) {
                if (stopReason === 'disconnect') {
                    setStatus('Upload interrupted: device disconnected.', true);
                } else {
                    setStatus('Upload aborted.');
                }
            } else {
                setStatus(`Error: ${error.message}`, true);
            }
            await abortTransfer();
        } finally {
            activeTransfer = null;
            if (controlWaiter) {
                controlWaiter.done(null);
            }
            busy = false;
            refreshControls();
        }
    }

    async function selectFile(file) {
        if (busy) {
            return;
        }

        resetProgress();
        selectedFile = null;
        fileBytes = null;
        fileCrc = 0;
        $('gifFileInfo').textContent = 'No file selected';
        $('gifFileInfo').title = '';
        setStatus('Choose a GIF file to upload (max 1 MiB).');
        refreshControls();

        if (!file) {
            return;
        }
        if (file.size === 0) {
            setStatus('That file is empty.', true);
            return;
        }
        if (file.size > MAX_FILE_BYTES) {
            setStatus('File is too large (maximum 1 MiB).', true);
            return;
        }

        const data = new Uint8Array(await file.arrayBuffer());
        const magic = String.fromCharCode(data[0], data[1], data[2], data[3], data[4], data[5]);

        if (magic !== 'GIF87a' && magic !== 'GIF89a') {
            setStatus('That file is not a GIF.', true);
            return;
        }

        selectedFile = file;
        fileBytes = data;
        fileCrc = crc16Ccitt(data);

        $('gifFileInfo').textContent = `${file.name} (${formatBytes(file.size)})`;
        $('gifFileInfo').title = file.name;
        setStatus('Ready to upload.');
        refreshControls();
    }

    function cancelUpload() {
        if (!busy || stopRequested) {
            return;
        }
        stopReason = 'cancel';
        stopRequested = true;
        setStatus('Cancelling…');
        if (activeTransfer && activeTransfer.wake) {
            activeTransfer.wake();
        }
        if (controlWaiter) {
            controlWaiter.done(null);
        }
    }

    function handleDisconnected() {
        if (busy) {
            stopReason = 'disconnect';
            stopRequested = true;
            if (activeTransfer && activeTransfer.wake) {
                activeTransfer.wake();
            }
            if (controlWaiter) {
                controlWaiter.done(null);
            }
        }
        refreshControls();
    }

    function init() {
        $('gifChooseBtn').addEventListener('click', () => {
            $('gifFileInput').click();
        });

        $('gifFileInput').addEventListener('change', event => {
            const file = (event.target.files && event.target.files[0]) || null;
            event.target.value = '';
            void selectFile(file);
        });

        $('gifStartBtn').addEventListener('click', startUpload);
        $('gifCancelBtn').addEventListener('click', cancelUpload);

        ble.on('connected', refreshControls);
        ble.on('disconnected', handleDisconnected);
        ble.on('frame', handleFrame);

        refreshControls();
    }

    return { init };
})();

/* ==========================================================================
 * Boot
 * ========================================================================== */

function initMandelbrot() {
    // Populated when the Mandelbrot mode is built.
}

ble.init();
simulation.init();
modeSelector.init();
gifUpload.init();
initMandelbrot();
tabs.init();
</script>
