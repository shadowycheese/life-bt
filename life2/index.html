 *                   511, since the chunk frame has a 3-byte header);
 *                   a 2-byte [0x50, 0x00] means 250 bytes, window 1
 *   0x51  chunk:    [0x51, seq(2), data...]     seq starts at 0
 *         reply:    [0x51, seq(2), status]
 *   0x54  finish:   [0x54, crc16(2)]            CRC-16/CCITT-FALSE of the file
 *         reply:    [0x53, status, deviceCrc(2)?]  deviceCrc present on error
 *   0x53  abort:    [0x53]                      reply: [0x52, status]
 *
 * The host sends up to `window` chunks without waiting for their acks and
 * resends unacked chunks after a timeout; the device writes chunk n at
 * offset n * maxChunk, so a resend is idempotent.
 *
 * Device -> browser, notify (9 bytes):
 *   [0x40, feedHi, feedLo, killHi, killLo, spawnHi, spawnLo, presetHi, presetLo]
 *
 * In the state reply, preset 0xFFFF (-1 as int16) means "custom": the feed or
 * kill rate was edited by hand, so no preset is selected.
 *
 * The device may also notify a single 3-byte frame with the same layout as a
 * write (0x41..0x44) to push one changed value; the browser applies both.
 * If the characteristic has no notify/indicate property, the browser sends
 * 0x40 and then reads the characteristic once to get the same 9-byte frame.
 * ========================================================================== */

const ble = (() => {
    const SERVICE_UUID = '41424344-4546-4748-494a-4b4c4d4e4f50';
    const CHARACTERISTIC_UUID = '51525354-5556-5758-595a-5b5c5d5e5f60';

    /*
     * Optional dedicated characteristic for state replies. The browser
     * subscribes to notifications on every characteristic in the service that
     * supports notify or indicate, so replies are received whichever one the
     * firmware uses; this UUID is only preferred for read-back.
     */
    const STATE_CHARACTERISTIC_UUID = '51525354-5556-5758-595a-5b5c5d5e5f61';

    const STATE_REQUEST_COMMAND = 0x40;
    const STATE_TIMEOUT_MS = 1500;
    const READ_FALLBACK_DELAY_MS = 250;

    let device = null;
    let controlCharacteristic = null;
    let stateCharacteristic = null;
    let notificationCharacteristics = [];
    let notificationsEnabled = false;
    let requestTimer = null;
    let requestFallback = null;
    let connecting = false;

    /*
     * connected    one argument: none; fired once the characteristics are ready
     * disconnected none; fired after the link has been torn down
     * frame        one argument: a DataView; return true to consume the frame
     */
    const listeners = {
        connected: [],
        disconnected: [],
        frame: []
    };

    function on(event, handler) {
        if (Array.isArray(listeners[event])) {
            listeners[event].push(handler);
        }
    }

    function emit(event) {
        listeners[event].forEach(handler => {
            try {
                handler();
            } catch (error) {
                console.error(error);
            }
        });
    }

    function hasControl() {
        return Boolean(controlCharacteristic);
    }

    async function sendBytes(bytes) {
        if (!controlCharacteristic) {
            return false;
        }

        const data = new Uint8Array(bytes);

        try {
            if (controlCharacteristic.properties && controlCharacteristic.properties.writeWithoutResponse) {
                await controlCharacteristic.writeValueWithoutResponse(data);
            } else {
                await controlCharacteristic.writeValue(data);
            }
            return true;
        } catch (error) {
            console.error('Write error:', error);
            return false;
        }
    }

    async function send(command, value) {
        const safeValue = Math.max(0, Math.min(65535, Number(value) || 0));
        const high = Math.floor(safeValue / 256);
        const low = safeValue % 256;
        return sendBytes([command, high, low]);
    }

    function clearRequest() {
        if (requestTimer !== null) {
            clearTimeout(requestTimer);
            requestTimer = null;
        }
        requestFallback = null;
    }

    function dispatchFrame(view) {
        if (!view) {
            return false;
        }

        let consumed = false;
        listeners.frame.forEach(handler => {
            try {
                if (handler(view)) {
                    consumed = true;
                }
            } catch (error) {
                console.error(error);
            }
        });

        if (consumed) {
            clearRequest();
        }
        return consumed;
    }

    function handleNotification(event) {
        const view = event.target.value;
        if (view) {
            const bytes = Array.from(new Uint8Array(view.buffer, view.byteOffset, view.byteLength))
                .map(byte => byte.toString(16).padStart(2, '0'))
                .join(' ');
            console.debug(`RX ${event.target.uuid}: ${bytes}`);
        }
        dispatchFrame(view);
    }

    async function readDeviceState() {
        if (!stateCharacteristic || !stateCharacteristic.properties.read) {
            return false;
        }

        try {
            return dispatchFrame(await stateCharacteristic.readValue());
        } catch (error) {
            console.warn('State read failed:', error);
            return false;
        }
    }

    function canNotify(characteristic) {
        return Boolean(
            characteristic &&
            characteristic.properties &&
            (characteristic.properties.notify || characteristic.properties.indicate)
        );
    }

    function canRead(characteristic) {
        return Boolean(characteristic && characteristic.properties && characteristic.properties.read);
    }

    /*
     * Subscribe to every characteristic that can notify. The firmware decides
     * which one carries replies (control, dedicated state, or another one in
     * the service), so subscribing to all of them means a reply is not lost
     * just because the browser guessed a different characteristic.
     */
    async function enableNotifications(characteristics) {
        const candidates = characteristics.filter(canNotify);
        if (!candidates.length) {
            console.warn(
                'No characteristic in the service supports notify or indicate. ' +
                'Check that the reply characteristic has the NOTIFY property.'
            );
            return false;
        }

        let subscribed = false;
        for (const characteristic of candidates) {
            characteristic.addEventListener('characteristicvaluechanged', handleNotification);
            try {
                await characteristic.startNotifications();
                notificationCharacteristics.push(characteristic);
                subscribed = true;
                console.info(`Subscribed to notifications on ${characteristic.uuid}`);
            } catch (error) {
                characteristic.removeEventListener('characteristicvaluechanged', handleNotification);
                console.warn(`Notifications unavailable on ${characteristic.uuid}:`, error);
            }
        }
        return subscribed;
    }

    async function requestState(onTimeout) {
        if (!controlCharacteristic) {
            if (onTimeout) {
                onTimeout();
            }
            return;
        }

        clearRequest();
        requestFallback = onTimeout || null;
        await send(STATE_REQUEST_COMMAND, 0);

        if (!notificationsEnabled) {
            requestTimer = setTimeout(async () => {
                requestTimer = null;
                const callback = requestFallback;
                requestFallback = null;
                if (await readDeviceState()) {
                    return;
                }
                if (callback) {
                    callback();
                }
            }, READ_FALLBACK_DELAY_MS);
            return;
        }

        requestTimer = setTimeout(() => {
            requestTimer = null;
            const callback = requestFallback;
            requestFallback = null;
            if (callback) {
                callback();
            }
        }, STATE_TIMEOUT_MS);
    }

    async function findStateCharacteristic(service, characteristics) {
        let dedicated = characteristics.find(characteristic =>
            characteristic.uuid === STATE_CHARACTERISTIC_UUID) || null;
        if (!dedicated) {
            try {
                dedicated = await service.getCharacteristic(STATE_CHARACTERISTIC_UUID);
            } catch (error) {
                dedicated = null;
            }
        }

        if (canRead(dedicated)) {
            console.info('Reading state from the dedicated state characteristic');
            return dedicated;
        }

        const readable = characteristics.find(canRead);
        if (readable) {
            console.info(`Reading state from ${readable.uuid}`);
            return readable;
        }

        console.warn('No readable characteristic; state read-back unavailable');
        return dedicated || controlCharacteristic;
    }

    function setStatus(text) {
        document.getElementById('status').innerText = text;
    }

    function setConnectionState(connected) {
        const connectBtn = document.getElementById('connectBtn');
        connectBtn.disabled = connected || connecting;
        connectBtn.style.backgroundColor = connected ? '#34c759' : '#007aff';
        connectBtn.innerText = connected ? 'Connected' : 'Connect';
        document.getElementById('disconnectBtn').disabled = !connected;
    }

    function resetLink() {
        if (!device && !controlCharacteristic && !stateCharacteristic) {
            return;
        }

        notificationCharacteristics.forEach(characteristic => {
            characteristic.removeEventListener('characteristicvaluechanged', handleNotification);
            try {
                characteristic.stopNotifications().catch(() => {});
            } catch (error) {
                console.warn('Could not stop notifications:', error);
            }
        });
        notificationCharacteristics = [];
        clearRequest();
        notificationsEnabled = false;
        stateCharacteristic = null;
        controlCharacteristic = null;
        device = null;

        setStatus('Device: Disconnected');
        setConnectionState(false);
        emit('disconnected');
    }

    async function connect() {
        if (connecting || (device && device.gatt && device.gatt.connected)) {
            return;
        }

        connecting = true;
        setConnectionState(false);
        setStatus('Scanning...');

        try {
            device = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'Cells-Remote' }],
                optionalServices: [SERVICE_UUID]
            });

            setStatus('Device: Connecting...');
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            let characteristics = [];
            try {
                characteristics = await service.getCharacteristics();
            } catch (error) {
                console.warn('Could not enumerate characteristics:', error);
            }
            characteristics.forEach(characteristic => {
                console.info(`Characteristic ${characteristic.uuid}`, characteristic.properties);
            });

            controlCharacteristic = characteristics.find(characteristic =>
                characteristic.uuid === CHARACTERISTIC_UUID)
                || await service.getCharacteristic(CHARACTERISTIC_UUID);

            stateCharacteristic = await findStateCharacteristic(service, characteristics);

            /* Make sure the characteristics found above are in the list too. */
            [controlCharacteristic, stateCharacteristic].forEach(characteristic => {
                if (characteristic && !characteristics.some(existing =>
                    existing.uuid === characteristic.uuid)) {
                    characteristics.push(characteristic);
                }
            });

            notificationsEnabled = await enableNotifications(characteristics);
            console.log('Control characteristic properties:', controlCharacteristic.properties);
            console.log('State characteristic properties:', stateCharacteristic && stateCharacteristic.properties);
            console.log('Notifications enabled:', notificationsEnabled);

            device.addEventListener('gattserverdisconnected', resetLink);
            setStatus('Device: Connected!');
            setConnectionState(true);
            emit('connected');
        } catch (error) {
            console.error(error);
            setStatus(`Device: Connection Failed [${error}]`);

            try {
                if (device && device.gatt && device.gatt.connected) {
                    device.gatt.disconnect();
                }
            } catch (disconnectError) {
                console.warn('Cleanup disconnect failed:', disconnectError);
            }

            notificationCharacteristics.forEach(characteristic => {
                characteristic.removeEventListener('characteristicvaluechanged', handleNotification);
            });
            notificationCharacteristics = [];
            notificationsEnabled = false;
            stateCharacteristic = null;
            controlCharacteristic = null;
            device = null;
        } finally {
            connecting = false;
            setConnectionState(Boolean(device && device.gatt && device.gatt.connected));
        }
    }

    async function disconnect() {
        try {
            if (device && device.gatt && device.gatt.connected) {
                device.gatt.disconnect();
            }
        } catch (error) {
            console.warn('Disconnect failed:', error);
        } finally {
            resetLink();
        }
    }

    function init() {
        document.getElementById('connectBtn').addEventListener('click', connect);
        document.getElementById('disconnectBtn').addEventListener('click', disconnect);
        setConnectionState(false);
    }

    return { init, on, send, sendBytes, requestState, hasControl };
})();

/* ==========================================================================
 * Simulation tab
 *
 * Owns the device settings, the controls that drive them and the touch pad.
 * The 9-byte state reply and the 3-byte value pushes are decoded here because
 * they all describe simulation settings.
 * ========================================================================== */

const simulation = (() => {
    const DEFAULT_SETTINGS = {
        feedRate: 32,
        killRate: 32,
        spawnChance: 100,
        preset: 0
    };

    const currentSettings = { ...DEFAULT_SETTINGS };

    const STATE_REPLY_COMMAND = 0x40;
    const PAD_COMMAND = 0x46;
    const PAD_COLUMNS = 64;
    const PAD_ROWS = 64;

    const RATE_CONFIG = {
        feed: {
            inputId: 'feedRateInput',
            setting: 'feedRate',
            command: 0x41,
            min: 1,
            max: 10000
        },
        kill: {
            inputId: 'killRateInput',
            setting: 'killRate',
            command: 0x42,
            min: 0,
            max: 10000
        }
    };

    const CONTROL_FIELDS = {
        0x41: RATE_CONFIG.feed,
        0x42: RATE_CONFIG.kill,
        0x43: { setting: 'spawnChance', min: 0, max: 5000 },
        0x44: { setting: 'preset', min: -1, max: 14, signed: true }
    };

    const STATE_FIELD_COMMANDS = [0x41, 0x42, 0x43, 0x44];

    const $ = id => document.getElementById(id);

    function formatPercent(rawValue) {
        const value = Number(rawValue) || 0;
        return (value / 100).toFixed(2);
    }

    function parsePercent(text) {
        const cleaned = String(text).replace(/%/g, '').replace(/\s/g, '').replace(',', '.');
        if (cleaned === '') {
            return NaN;
        }
        const value = Number(cleaned);
        return Number.isFinite(value) ? Math.round(value * 100) : NaN;
    }

    function setControlState(connected) {
        const controls = [
            $('feedRateInput'),
            $('killRateInput'),
            $('spawnChanceDropdown'),
            $('presetDropdown')
        ];

        controls.forEach(control => {
            control.disabled = !connected;
        });

        document.querySelectorAll('#tab-simulation .step-btn').forEach(button => {
            button.disabled = !connected;
        });

        $('clearBtn').disabled = !connected;
        $('cycleBtn').disabled = !connected;

        const pad = $('touchPad');
        pad.classList.toggle('disabled', !connected);
        pad.setAttribute('aria-disabled', String(!connected));
    }

    function setSpawnChanceOption(value) {
        const dropdown = $('spawnChanceDropdown');
        const raw = String(value);
        const match = Array.from(dropdown.options).find(option => option.value === raw);
        const dynamic = dropdown.querySelector('option[data-dynamic]');

        if (match) {
            if (dynamic) {
                dynamic.remove();
            }
        } else {
            const option = dynamic || document.createElement('option');
            if (!dynamic) {
                option.dataset.dynamic = 'true';
                dropdown.appendChild(option);
            }
            option.value = raw;
            option.textContent = `${(value / 100).toFixed(2)}%`;
        }

        dropdown.value = raw;
    }

    function applyCurrentControlsToUI() {
        Object.values(RATE_CONFIG).forEach(rate => {
            const input = $(rate.inputId);
            if (document.activeElement === input) {
                return;
            }
            input.value = formatPercent(currentSettings[rate.setting]);
        });
        setSpawnChanceOption(currentSettings.spawnChance);

        const presetDropdown = $('presetDropdown');
        presetDropdown.value = currentSettings.preset < 0 ? '' : String(currentSettings.preset);
    }

    function clearPresetSelection() {
        currentSettings.preset = -1;
        $('presetDropdown').value = '';
    }

    function clampControlValue(field, value) {
        return Math.max(field.min, Math.min(field.max, Math.round(Number(value) || 0)));
    }

    function applyControlValue(command, rawValue) {
        const field = CONTROL_FIELDS[command];
        if (!field) {
            return false;
        }
        const value = field.signed && rawValue > 0x7fff ? rawValue - 0x10000 : rawValue;
        currentSettings[field.setting] = clampControlValue(field, value);
        return true;
    }

    function applyStateFrame(view) {
        if (!view) {
            return false;
        }

        let applied = false;
        if (view.byteLength >= 9 && view.getUint8(0) === STATE_REPLY_COMMAND) {
            STATE_FIELD_COMMANDS.forEach((command, index) => {
                applied = applyControlValue(command, view.getUint16(1 + index * 2)) || applied;
            });
        } else if (view.byteLength === 3) {
            applied = applyControlValue(view.getUint8(0), view.getUint16(1));
        }

        if (!applied) {
            return false;
        }

        applyCurrentControlsToUI();
        return true;
    }

    async function sendAllSettings() {
        await ble.send(0x41, currentSettings.feedRate);
        await ble.send(0x42, currentSettings.killRate);
        await ble.send(0x43, currentSettings.spawnChance);
        if (currentSettings.preset >= 0) {
            await ble.send(0x44, currentSettings.preset);
        }
    }

    async function setRate(rateKey, rawValue) {
        const rate = RATE_CONFIG[rateKey];
        const value = Math.max(rate.min, Math.min(rate.max, Math.round(Number(rawValue) || 0)));
        const changed = value !== currentSettings[rate.setting];
        currentSettings[rate.setting] = value;
        $(rate.inputId).value = formatPercent(value);
        if (changed) {
            clearPresetSelection();
            await ble.send(rate.command, value);
        }
    }

    function stepRate(rateKey, deltaPercent) {
        const rate = RATE_CONFIG[rateKey];
        const delta = Math.round(Number(deltaPercent) * 100);
        return setRate(rateKey, currentSettings[rate.setting] + delta);
    }

    function commitRateInput(rateKey) {
        const rate = RATE_CONFIG[rateKey];
        const input = $(rate.inputId);
        const parsed = parsePercent(input.value);
        if (Number.isNaN(parsed)) {
            input.value = formatPercent(currentSettings[rate.setting]);
            return;
        }
        return setRate(rateKey, parsed);
    }

    function sendPadPosition(event) {
        if (!ble.hasControl()) {
            return;
        }
        if (typeof event.button === 'number' && event.button !== 0) {
            return;
        }

        const pad = $('touchPad');
        const rect = pad.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) {
            return;
        }

        const x = Math.max(0, Math.min(PAD_COLUMNS - 1,
            Math.floor((event.clientX - rect.left) / rect.width * PAD_COLUMNS)));
        const y = Math.max(0, Math.min(PAD_ROWS - 1,
            Math.floor((event.clientY - rect.top) / rect.height * PAD_ROWS)));

        const marker = $('padMarker');
        marker.hidden = false;
        marker.style.left = `${((x + 0.5) / PAD_COLUMNS) * 100}%`;
        marker.style.top = `${((y + 0.5) / PAD_ROWS) * 100}%`;

        ble.send(PAD_COMMAND, (x << 8) | y);
    }

    async function clearDevice() {
        await ble.send(0x45, 0);
    }

    async function cycleDevice() {
        await ble.send(0x47, 0);
    }

    async function updateSpawnChance(val) {
        const value = Number(val);
        currentSettings.spawnChance = value;
        await ble.send(0x43, value);
    }

    async function updatePreset(val) {
        if (val === '' || val === null || val === undefined) {
            return;
        }
        const value = Number(val);
        if (!Number.isInteger(value) || value < 0) {
            return;
        }
        currentSettings.preset = value;
        await ble.send(0x44, value);
        await ble.requestState();
    }

    async function handleConnected() {
        setControlState(true);
        applyCurrentControlsToUI();
        await ble.requestState(() => sendAllSettings());
    }

    function handleDisconnected() {
        $('padMarker').hidden = true;
        setControlState(false);
    }

    function init() {
        $('touchPad').addEventListener('pointerdown', sendPadPosition);

        document.querySelectorAll('#tab-simulation .step-btn').forEach(button => {
            button.addEventListener('click', () => {
                stepRate(button.dataset.rate, button.dataset.delta);
            });
        });

        Object.entries(RATE_CONFIG).forEach(([rateKey, rate]) => {
            const input = $(rate.inputId);

            input.addEventListener('change', () => {
                commitRateInput(rateKey);
            });

            input.addEventListener('keydown', event => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    input.blur();
                } else if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
                    event.preventDefault();
                    stepRate(rateKey, event.key === 'ArrowUp' ? 0.01 : -0.01);
                }
            });
        });

        $('presetDropdown').addEventListener('change', event => updatePreset(event.target.value));
        $('spawnChanceDropdown').addEventListener('change', event => updateSpawnChance(event.target.value));
        $('clearBtn').addEventListener('click', clearDevice);
        $('cycleBtn').addEventListener('click', cycleDevice);

        ble.on('connected', handleConnected);
        ble.on('disconnected', handleDisconnected);
        ble.on('frame', applyStateFrame);

        setControlState(false);
        applyCurrentControlsToUI();
    }

    return { init };
})();

/* ==========================================================================
 * Tabs
 *
 * Panels live in the DOM at all times, so switching tabs never disturbs the
 * Bluetooth link. A tabshown event is dispatched for views that need to size
 * or start something only when visible.
 * ========================================================================== */

const tabs = (() => {
    const DEFAULT_TAB = 'simulation';
    const buttons = Array.from(document.querySelectorAll('.tab'));
    const panels = Array.from(document.querySelectorAll('.tab-panel'));
    const names = buttons.map(button => button.dataset.tab);
    const tablist = document.querySelector('.tabs');

    let current = null;

    function show(name, updateHash) {
        if (!names.includes(name)) {
            name = DEFAULT_TAB;
        }

        if (current === name) {
            if (updateHash && location.hash !== `#${name}`) {
                location.hash = name;
            }
            return;
        }
        current = name;

        buttons.forEach(button => {
            const selected = button.dataset.tab === name;
            button.setAttribute('aria-selected', String(selected));
            button.tabIndex = selected ? 0 : -1;
        });

        panels.forEach(panel => {
            panel.hidden = panel.id !== `tab-${name}`;
        });

        if (updateHash && location.hash !== `#${name}`) {
            location.hash = name;
        }

        document.dispatchEvent(new CustomEvent('tabshown', { detail: { tab: name } }));
    }

    function init() {
        buttons.forEach(button => {
            button.addEventListener('click', () => show(button.dataset.tab, true));
        });

        tablist.addEventListener('keydown', event => {
            const index = buttons.indexOf(document.activeElement);
            if (index === -1) {
                return;
            }

            let next = index;
            if (event.key === 'ArrowRight') {
                next = (index + 1) % buttons.length;
            } else if (event.key === 'ArrowLeft') {
                next = (index - 1 + buttons.length) % buttons.length;
            } else if (event.key === 'Home') {
                next = 0;
            } else if (event.key === 'End') {
                next = buttons.length - 1;
            } else {
                return;
            }

            event.preventDefault();
            buttons[next].focus();
            show(buttons[next].dataset.tab, true);
        });

        window.addEventListener('hashchange', () => {
            const name = location.hash.slice(1);
            show(name, false);
            if (!names.includes(name)) {
                history.replaceState(null, '', `#${current}`);
            }
        });

        const initial = location.hash.slice(1);
        if (names.includes(initial)) {
            show(initial, false);
        } else {
            show(DEFAULT_TAB, false);
            history.replaceState(null, '', `#${DEFAULT_TAB}`);
        }
    }

    return { init, show };
})();

/* ==========================================================================
 * Mode selection (available on every tab)
 *
 * Fire-and-forget: [0x7E, mode] where mode is 0 simulation, 1 GIF playback,
 * 2 Mandelbrot. The device does not reply.
 * ========================================================================== */

const modeSelector = (() => {
    const MODE_COMMAND = 0x7E;
    const buttons = Array.from(document.querySelectorAll('.select-mode-btn'));

    let connected = false;
    let uploading = false;

    function refresh() {
        const disabled = !connected || uploading;
        buttons.forEach(button => {
            button.disabled = disabled;
        });
    }

    function setConnected(value) {
        connected = value;
        refresh();
    }

    function setUploading(value) {
        uploading = value;
        refresh();
    }

    async function selectMode(event) {
        const mode = Number(event.currentTarget.dataset.mode);
        if (!Number.isInteger(mode)) {
            return;
        }
        await ble.sendBytes([MODE_COMMAND, mode]);
    }

    function init() {
        buttons.forEach(button => {
            button.addEventListener('click', selectMode);
        });

        ble.on('connected', () => setConnected(true));
        ble.on('disconnected', () => setConnected(false));
        setConnected(false);
    }

    return { init, setUploading };
})();

/* ==========================================================================
 * GIF preparation (GIF playback tab)
 *
 * The firmware sizes its frame buffer for exactly 64x64 (10 * 64 * 64 bytes)
 * and its player expects a 64x64 canvas. A larger GIF passes the decoder's
 * width check and then overflows that buffer, so every upload is converted
 * here, in the browser, before a single byte is sent. The upload itself must
 * also fit the device's 1 MiB save buffer.
 *
 * The conversion is shaped by the device's decoder (AnimatedGIF in cooked
 * mode with a frame buffer):
 *
 *   - frames are composited with the GIF disposal rules, so transparency
 *     looks the way it does in a browser
 *   - the frame is cropped to a centred square (the longer edge is clipped
 *     away) and scaled to 64 (nearest neighbour for whole-number scales,
 *     otherwise smooth)
 *   - one global colour table is written; index 0 is opaque black because the
 *     decoder paints disposal-2 holes with the background index, and the last
 *     index is the 1-bit transparent colour
 *   - every frame covers the whole canvas with disposal 2, which is the only
 *     way the decoder fills transparent pixels with the background instead of
 *     leaving the previous frame visible
 *   - frame delays are copied over in centiseconds
 *
 * The firmware does not verify the upload CRC and cannot report a decode
 * failure, so the encoded result is read back here before it is offered.
 * ========================================================================== */

const gifPrep = (() => {
    const CANVAS_SIZE = 64;
    /* The device stores the whole upload in an exactly 1 MiB save buffer. */
    const MAX_OUTPUT_BYTES = 1024 * 1024;
    const MAX_SOURCE_DIMENSION = 2048;
    const MAX_SOURCE_FRAMES = 2000;
    /* The whole file is decoded in memory, so keep a ceiling on it too. */
    const MAX_SOURCE_BYTES = 64 * 1024 * 1024;
    const SAMPLE_BUDGET = 1000000;

    /* Try the best quality first, then the fallback the UI mentions. */
    const COLOR_ATTEMPTS = [256, 64];

    const CANCELLED = Symbol('gif conversion cancelled');

    function fail(message) {
        return new Error(message);
    }

    function formatSize(bytes) {
        if (bytes >= 1024 * 1024) {
            return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
        }
        if (bytes >= 1024) {
            return `${(bytes / 1024).toFixed(1)} KB`;
        }
        return `${bytes} B`;
    }

    function isGif(data) {
        if (data.length < 14) {
            return false;
        }
        const magic = String.fromCharCode(data[0], data[1], data[2], data[3], data[4], data[5]);
        return magic === 'GIF87a' || magic === 'GIF89a';
    }

    function yieldToBrowser() {
        return new Promise(resolve => setTimeout(resolve, 0));
    }

    function thresholdAlpha(pixels) {
        for (let i = 0; i < pixels.length; i += 4) {
            if (pixels[i + 3] >= 128) {
                pixels[i + 3] = 255;
            } else {
                pixels[i] = 0;
                pixels[i + 1] = 0;
                pixels[i + 2] = 0;
                pixels[i + 3] = 0;
            }
        }
    }

    function clearFrameRect(buffer, canvasWidth, frame) {
        const left = Math.max(0, Math.min(frame.x, canvasWidth));
        const right = Math.max(left, Math.min(frame.x + frame.width, canvasWidth));
        if (right <= left) {
            return;
        }
        for (let y = 0; y < frame.height; y++) {
            const row = frame.y + y;
            if (row < 0) {
                continue;
            }
            const start = (row * canvasWidth + left) * 4;
            buffer.fill(0, start, start + (right - left) * 4);
        }
    }

    function countDelays(reader, frameCount) {
        let zeroDelayFrames = 0;
        let shortDelayFrames = 0;
        for (let i = 0; i < frameCount; i++) {
            const delay = reader.frameInfo(i).delay;
            if (delay === 0) {
                zeroDelayFrames += 1;
            }
            if (delay < 2) {
                shortDelayFrames += 1;
            }
        }
        return { zeroDelayFrames, shortDelayFrames };
    }

    /*
     * A 64x64 GIF is uploaded untouched, as asked. The device still has two
     * sharp edges with such files, so at least leave a trace in the console:
     * partial frames with disposal 2 lose the pixels it never redraws, and
     * disposal 3 is not implemented at all.
     */
    function inspectPassthrough(reader, frameCount) {
        let partial = 0;
        let disposal = 0;
        for (let i = 0; i < frameCount; i++) {
            const frame = reader.frameInfo(i);
            if (frame.x !== 0 || frame.y !== 0 ||
                frame.width !== CANVAS_SIZE || frame.height !== CANVAS_SIZE) {
                partial += 1;
            }
            if (frame.disposal === 2 || frame.disposal === 3) {
                disposal += 1;
            }
        }
        if (partial && disposal) {
            console.warn(
                `${partial} frame(s) are smaller than the canvas and ${disposal} use ` +
                'disposal 2 or 3; the device may leave stale pixels on screen.'
            );
        }
    }

    async function decodeFrames(reader, options) {
        const { width, height, frameCount, report, shouldCancel } = options;

        const source = document.createElement('canvas');
        source.width = width;
        source.height = height;
        const sourceContext = source.getContext('2d', { willReadFrequently: true });

        const buffer = new Uint8ClampedArray(width * height * 4);
        const image = new ImageData(buffer, width, height);

        const target = document.createElement('canvas');
        target.width = CANVAS_SIZE;
        target.height = CANVAS_SIZE;
        const targetContext = target.getContext('2d', { willReadFrequently: true });

        /* Clip to a centred square: the shorter edge fills the canvas and the
           overhanging sides (or top/bottom) are dropped, never letterboxed. */
        const side = Math.min(width, height);
        const sourceX = Math.floor((width - side) / 2);
        const sourceY = Math.floor((height - side) / 2);

        /* Nearest neighbour keeps pixel art crisp, but only when the ratio is
           a whole number; otherwise smooth scaling looks better. */
        const pixelArt = CANVAS_SIZE % side === 0 || side % CANVAS_SIZE === 0;
        targetContext.imageSmoothingEnabled = !pixelArt;
        if (!pixelArt) {
            targetContext.imageSmoothingQuality = 'high';
        }

        const frames = [];
        let previous = null;
        let restored = null;
        let lastYield = 0;

        for (let index = 0; index < frameCount; index++) {
            if (shouldCancel()) {
                throw CANCELLED;
            }

            const info = reader.frameInfo(index);

            /* Apply the previous frame's disposal before drawing this one. */
            if (previous) {
                if (previous.disposal === 2) {
                    clearFrameRect(buffer, width, previous);
                } else if (previous.disposal === 3 && restored) {
                    buffer.set(restored);
                }
            }

            const snapshot = info.disposal === 3 ? buffer.slice() : null;

            /* Transparent pixels are left alone, so the buffer keeps whatever
               the previous frames painted, exactly like a browser. */
            reader.decodeAndBlitFrameRGBA(index, buffer);

            sourceContext.putImageData(image, 0, 0);
            targetContext.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            targetContext.drawImage(
                source, sourceX, sourceY, side, side,
                0, 0, CANVAS_SIZE, CANVAS_SIZE
            );

            const pixels = targetContext.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE).data;
            thresholdAlpha(pixels);

            frames.push({ pixels, delay: info.delay });
            previous = info;
            restored = snapshot;

            const now = performance.now();
            if (now - lastYield > 20 || index === frameCount - 1) {
                lastYield = now;
                report(
                    0.75 * (index + 1) / frameCount,
                    `Converting… ${index + 1} / ${frameCount} frames`
                );
                await yieldToBrowser();
            }
        }

        return frames;
    }

    /*
     * Build the palette in the order the firmware needs: index 0 opaque black
     * (also the logical screen background), last index transparent.
     */
    function buildPalette(quantized, size) {
        const transparent = quantized.findIndex(color => color.length > 3 && color[3] < 128);
        const palette = new Array(size);

        palette[0] = [0, 0, 0, 255];
        palette[size - 1] = transparent >= 0
            ? [quantized[transparent][0], quantized[transparent][1], quantized[transparent][2], 0]
            : [0, 0, 0, 0];

        let next = 1;
        for (let i = 0; i < quantized.length && next < size - 1; i++) {
            if (i === transparent) {
                continue;
            }
            const color = quantized[i];
            palette[next++] = [color[0], color[1], color[2], color.length > 3 ? color[3] : 255];
        }
        while (next < size - 1) {
            palette[next++] = [0, 0, 0, 255];
        }

        return palette;
    }

    function quantizeFrames(frames, size) {
        const perFrame = CANVAS_SIZE * CANVAS_SIZE;
        const total = frames.length * perFrame;
        const stride = Math.max(1, Math.ceil(total / SAMPLE_BUDGET));
        const count = frames.length * Math.ceil(perFrame / stride);
        const sample = new Uint8ClampedArray(count * 4);
        let offset = 0;

        frames.forEach(frame => {
            const pixels = frame.pixels;
            for (let pixel = 0; pixel < perFrame; pixel += stride) {
                const source = pixel * 4;
                sample[offset++] = pixels[source];
                sample[offset++] = pixels[source + 1];
                sample[offset++] = pixels[source + 2];
                sample[offset++] = pixels[source + 3];
            }
        });

        const quantized = gifenc.quantize(sample, size - 2, {
            format: 'rgba4444',
            oneBitAlpha: true
        });
        return buildPalette(quantized, size);
    }

    async function encodeFrames(frames, palette, report, shouldCancel) {
        const transparentIndex = palette.length - 1;
        const colorDepth = Math.log2(palette.length);
        const gif = gifenc.GIFEncoder();
        let lastYield = 0;

        for (let index = 0; index < frames.length; index++) {
            if (shouldCancel()) {
                throw CANCELLED;
            }

            const frame = frames[index];
            const indexed = gifenc.applyPalette(frame.pixels, palette, 'rgba4444');

            gif.writeFrame(indexed, CANVAS_SIZE, CANVAS_SIZE, {
                palette: index === 0 ? palette : null,
                delay: frame.delay * 10,
                transparent: true,
                transparentIndex,
                dispose: 2,
                repeat: 0,
                colorDepth
            });

            const now = performance.now();
            if (now - lastYield > 20 || index === frames.length - 1) {
                lastYield = now;
                report(
                    0.8 + 0.19 * (index + 1) / frames.length,
                    `Encoding… ${index + 1} / ${frames.length} frames`
                );
                await yieldToBrowser();
            }
        }

        gif.finish();
        return gif.bytes();
    }

    function validate(bytes, frameCount) {
        let reader;
        try {
            reader = new GifReader(bytes);
        } catch (error) {
            throw fail('The converted GIF could not be read back.');
        }
        if (reader.width !== CANVAS_SIZE || reader.height !== CANVAS_SIZE) {
            throw fail('The converted GIF has the wrong size.');
        }
        if (reader.numFrames() !== frameCount) {
            throw fail('The converted GIF lost frames while encoding.');
        }
        reader.decodeAndBlitFrameRGBA(0, new Uint8ClampedArray(CANVAS_SIZE * CANVAS_SIZE * 4));
    }

    async function prepare(file, options = {}) {
        const report = options.onProgress || (() => {});
        const shouldCancel = options.shouldCancel || (() => false);

        if (file.size > MAX_SOURCE_BYTES) {
            throw fail(`That file is ${formatSize(file.size)}; the largest source is 64 MB.`);
        }

        const data = new Uint8Array(await file.arrayBuffer());
        if (shouldCancel()) {
            throw CANCELLED;
        }
        if (!isGif(data)) {
            throw fail('That file is not a GIF.');
        }

        let reader;
        try {
            reader = new GifReader(data);
        } catch (error) {
            throw fail('That GIF could not be read (it may be corrupt).');
        }

        const width = reader.width;
        const height = reader.height;
        if (!width || !height) {
            throw fail('That GIF does not declare a canvas size.');
        }
        if (width > MAX_SOURCE_DIMENSION || height > MAX_SOURCE_DIMENSION) {
            throw fail(
                `That GIF is ${width} × ${height}; the largest supported source is ` +
                `${MAX_SOURCE_DIMENSION} × ${MAX_SOURCE_DIMENSION}.`
            );
        }

        const frameCount = reader.numFrames();
        if (frameCount <= 0) {
            throw fail('That GIF has no frames.');
        }
        if (frameCount > MAX_SOURCE_FRAMES) {
            throw fail(
                `That GIF has ${frameCount} frames; the largest supported count is ` +
                `${MAX_SOURCE_FRAMES}.`
            );
        }

        if (width === CANVAS_SIZE && height === CANVAS_SIZE) {
            if (data.length > MAX_OUTPUT_BYTES) {
                throw fail(
                    `Already 64 × 64, but it is ${formatSize(data.length)} — ` +
                    'over the 1 MiB limit.'
                );
            }
            inspectPassthrough(reader, frameCount);
            return {
                bytes: data,
                width,
                height,
                frameCount,
                size: data.length,
                sourceSize: data.length,
                sourceWidth: width,
                sourceHeight: height,
                processed: false,
                colors: null,
                reduced: false,
                ...countDelays(reader, frameCount)
            };
        }

        report(0, 'Converting…');

        let frames;
        try {
            frames = await decodeFrames(reader, {
                width,
                height,
                frameCount,
                report,
                shouldCancel
            });
        } catch (error) {
            if (error === CANCELLED) {
                throw error;
            }
            console.error(error);
            throw fail('This GIF could not be decoded (it may be truncated).');
        }

        let output = null;
        for (const colors of COLOR_ATTEMPTS) {
            if (shouldCancel()) {
                throw CANCELLED;
            }

            report(0.76, 'Choosing colours…');
            await yieldToBrowser();

            let palette;
            let bytes;
            try {
                palette = quantizeFrames(frames, colors);
                report(0.8, 'Encoding…');
                await yieldToBrowser();
                bytes = await encodeFrames(frames, palette, report, shouldCancel);
            } catch (error) {
                if (error === CANCELLED) {
                    throw error;
                }
                console.error(error);
                throw fail('This GIF could not be converted.');
            }

            output = { colors, bytes };
            if (bytes.length <= MAX_OUTPUT_BYTES) {
                break;
            }
        }

        if (!output || output.bytes.length > MAX_OUTPUT_BYTES) {
            throw fail(
                `The converted GIF is ${formatSize(output.bytes.length)} — over the ` +
                '1 MiB limit, even at 64 colours.'
            );
        }

        validate(output.bytes, frameCount);

        return {
            bytes: output.bytes,
            width: CANVAS_SIZE,
            height: CANVAS_SIZE,
            frameCount,
            size: output.bytes.length,
            sourceSize: data.length,
            sourceWidth: width,
            sourceHeight: height,
            processed: true,
            colors: output.colors,
            reduced: output.colors !== COLOR_ATTEMPTS[0],
            zeroDelayFrames: frames.reduce((count, frame) => count + (frame.delay === 0 ? 1 : 0), 0)
        };
    }

    return { prepare, CANCELLED };
})();

/* ==========================================================================
 * GIF upload (GIF playback tab)
 *
 * See the protocol description above the ble module. Chunks may be in flight
 * up to the window advertised by the device; every chunk is acked and any
 * chunk that goes unanswered for 2 s is resent (the device writes chunk n at
 * offset n * maxChunk, so resends are idempotent).
 * ========================================================================== */

const gifUpload = (() => {
    const START_COMMAND = 0x50;
    const CHUNK_COMMAND = 0x51;
    const ABORT_COMMAND = 0x52;
    const COMPLETE_COMMAND = 0x53;

    const START_ACK = 0x50;
    const CHUNK_ACK = 0x51;
    const ABORT_ACK = 0x52;
    const COMPLETE_ACK = 0x53;

    const MIN_CHUNK_BYTES = 1;
    /* A chunk frame is 3 header bytes + data, so MTU 517 allows 511 data bytes. */
    const MAX_CHUNK_BYTES = 511;
    const DEFAULT_CHUNK_BYTES = 250;
    const DEFAULT_WINDOW = 1;
    const MAX_WINDOW = 32;
    const NAME_BYTES = 32;
    const ACK_TIMEOUT_MS = 2000;
    const MAX_ATTEMPTS = 3;

    const CANCELLED = Symbol('upload cancelled');

    const $ = id => document.getElementById(id);

    let selectedFile = null;
    let fileBytes = null;
    let fileCrc = 0;

    let busy = false;
    let preparing = false;
    let stopRequested = false;
    let stopReason = null;
    let activeTransfer = null;
    let controlWaiter = null;

    let progressFrame = 0;
    let pendingProgress = null;

    function writeUint32BE(target, offset, value) {
        target[offset] = (value >>> 24) & 0xff;
        target[offset + 1] = (value >>> 16) & 0xff;
        target[offset + 2] = (value >>> 8) & 0xff;
        target[offset + 3] = value & 0xff;
    }

    function crc16Ccitt(data) {
        let crc = 0xffff;
        for (let i = 0; i < data.length; i++) {
            crc ^= data[i] << 8;
            for (let bit = 0; bit < 8; bit++) {
                crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xffff : (crc << 1) & 0xffff;
            }
        }
        return crc;
    }

    function clampInt(value, min, max, fallback) {
        const number = Number(value);
        if (!Number.isFinite(number)) {
            return fallback;
        }
        return Math.max(min, Math.min(max, Math.round(number)));
    }

    function buildName(name) {
        let ascii = Array.from(String(name || 'upload.gif')).map(character => {
            const code = character.charCodeAt(0);
            return code >= 32 && code < 127 ? character : '_';
        }).join('') || 'upload.gif';

        if (ascii.length > NAME_BYTES - 1) {
            const suffix = ascii.toLowerCase().endsWith('.gif') ? ascii.slice(-4) : '';
            ascii = ascii.slice(0, NAME_BYTES - 1 - suffix.length) + suffix;
        }

        const out = new Uint8Array(NAME_BYTES);
        for (let i = 0; i < ascii.length; i++) {
            out[i] = ascii.charCodeAt(i) & 0x7f;
        }
        return out;
    }

    function formatBytes(bytes) {
        if (bytes >= 1024 * 1024) {
            return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
        }
        if (bytes >= 1024) {
            return `${(bytes / 1024).toFixed(1)} KB`;
        }
        return `${bytes} B`;
    }

    function setStatus(text, isError) {
        const status = $('gifStatus');
        status.textContent = text;
        status.classList.toggle('error', Boolean(isError));
    }

    function refreshControls() {
        const connected = ble.hasControl();
        const working = busy || preparing;
        $('gifFileInput').disabled = working;
        $('gifChooseBtn').disabled = working;
        $('gifStartBtn').disabled = working || !fileBytes || !connected;
        $('gifCancelBtn').disabled = !working;
        modeSelector.setUploading(working);
    }

    function paintPrepProgress(fraction, text) {
        const percent = Math.max(0, Math.min(100, Math.round(fraction * 100)));
        $('gifProgressBar').style.width = `${percent}%`;
        $('gifProgress').setAttribute('aria-valuenow', String(percent));
        setStatus(text);
    }

    function describeResult(file, result) {
        if (!result.processed) {
            return `${file.name} (${formatBytes(result.size)}) — already 64 × 64`;
        }
        const colors = result.reduced ? ', 64 colours' : '';
        return `${file.name} (${formatBytes(result.sourceSize)} → ${formatBytes(result.size)}, ` +
            `64 × 64, ${result.frameCount} frames${colors})`;
    }

    function resultMessage(result) {
        const parts = [];
        if (!result.processed) {
            parts.push(`Ready to upload (already 64 × 64, ${formatBytes(result.size)}).`);
        } else {
            parts.push(
                `Ready to upload (64 × 64, ${result.frameCount} frames, ` +
                `${formatBytes(result.size)}).`
            );
        }
        if (result.reduced) {
            parts.push('Reduced to 64 colours to stay under 1 MiB.');
        }
        if (result.zeroDelayFrames > 0) {
            const frames = result.zeroDelayFrames === 1 ? 'frame has' : 'frames have';
            parts.push(`${result.zeroDelayFrames} ${frames} no delay; the device plays those at 100 ms.`);
        }
        return parts.join(' ');
    }

    function resetProgress() {
        if (progressFrame) {
            cancelAnimationFrame(progressFrame);
            progressFrame = 0;
        }
        pendingProgress = null;
        $('gifProgress').hidden = true;
        $('gifProgressBar').style.width = '0%';
        $('gifProgress').setAttribute('aria-valuenow', '0');
    }

    function paintProgress(done, total) {
        const percent = total > 0 ? Math.min(100, Math.round((done / total) * 100)) : 0;
        $('gifProgressBar').style.width = `${percent}%`;
        $('gifProgress').setAttribute('aria-valuenow', String(percent));
        setStatus(`Uploading… ${percent}% (${done} / ${total} chunks)`);
    }

    function scheduleProgress(done, total) {
        pendingProgress = { done, total };
        if (progressFrame) {
            return;
        }
        progressFrame = requestAnimationFrame(() => {
            progressFrame = 0;
            const pending = pendingProgress;
            pendingProgress = null;
            if (pending) {
                paintProgress(pending.done, pending.total);
            }
        });
    }

    function flushProgress() {
        if (progressFrame) {
            cancelAnimationFrame(progressFrame);
            progressFrame = 0;
        }
        if (pendingProgress) {
            const { done, total } = pendingProgress;
            pendingProgress = null;
            paintProgress(done, total);
        }
    }

    function matchStart(view) {
        if (view.byteLength < 2 || view.getUint8(0) !== START_ACK) {
            return undefined;
        }

        const status = view.getUint8(1);
        if (status !== 0) {
            return { status };
        }
        if (view.byteLength >= 5) {
            return { status, maxChunk: view.getUint16(2), window: view.getUint8(4) };
        }
        if (view.byteLength === 2) {
            return { status, maxChunk: DEFAULT_CHUNK_BYTES, window: DEFAULT_WINDOW };
        }
        return { status: 255 };
    }

    function matchComplete(view) {
        if (view.byteLength < 2 || view.getUint8(0) !== COMPLETE_ACK) {
            return undefined;
        }
        return {
            status: view.getUint8(1),
            deviceCrc: view.byteLength >= 4 ? view.getUint16(2) : null
        };
    }

    function matchAbort(view) {
        if (view.byteLength < 2 || view.getUint8(0) !== ABORT_ACK) {
            return undefined;
        }
        return { status: view.getUint8(1) };
    }

    function waitForControl(match, timeoutMs) {
        return new Promise(resolve => {
            if (controlWaiter) {
                controlWaiter.done(null);
            }

            let timer = null;
            const waiter = {
                match,
                done(value) {
                    if (timer !== null) {
                        clearTimeout(timer);
                        timer = null;
                    }
                    if (controlWaiter === waiter) {
                        controlWaiter = null;
                    }
                    resolve(value);
                }
            };

            controlWaiter = waiter;
            timer = setTimeout(() => waiter.done(null), timeoutMs);
        });
    }

    function waitForWake(transfer, timeoutMs) {
        return new Promise(resolve => {
            let timer = null;
            const done = () => {
                if (timer !== null) {
                    clearTimeout(timer);
                    timer = null;
                }
                if (transfer.wake === done) {
                    transfer.wake = null;
                }
                resolve();
            };
            transfer.wake = done;
            timer = setTimeout(done, timeoutMs);
        });
    }

    function handleFrame(view) {
        if (!view || view.byteLength < 2) {
            return false;
        }

        const command = view.getUint8(0);

        if (activeTransfer && command === CHUNK_ACK && view.byteLength >= 4) {
            const seq = view.getUint16(1);
            const status = view.getUint8(3);
            const state = activeTransfer.pending.get(seq);

            if (state) {
                if (status === 0) {
                    activeTransfer.pending.delete(seq);
                    activeTransfer.acked += 1;
                } else {
                    activeTransfer.error = new Error(`Device rejected chunk ${seq + 1} (status ${status})`);
                }
                if (activeTransfer.wake) {
                    activeTransfer.wake();
                }
            }
            return true;
        }

        if (controlWaiter) {
            const result = controlWaiter.match(view);
            if (result !== undefined) {
                controlWaiter.done(result);
                return true;
            }
        }

        return false;
    }

    async function sendChunk(seq, chunkSize) {
        const offset = seq * chunkSize;
        const length = Math.min(chunkSize, fileBytes.length - offset);
        const frame = new Uint8Array(3 + length);
        frame[0] = CHUNK_COMMAND;
        frame[1] = (seq >>> 8) & 0xff;
        frame[2] = seq & 0xff;
        frame.set(fileBytes.subarray(offset, offset + length), 3);

        if (!(await ble.sendBytes(frame))) {
            throw new Error('Bluetooth write was rejected');
        }
    }

    async function abortTransfer() {
        if (!ble.hasControl()) {
            return;
        }
        const abortAckPromise = waitForControl(matchAbort, ACK_TIMEOUT_MS);
        if (!(await ble.sendBytes([ABORT_COMMAND]))) {
            return;
        }
        await abortAckPromise;
    }

    async function runTransfer() {
        const size = fileBytes.length;
        const name = buildName(selectedFile.name);
        const startFrame = new Uint8Array(5 + NAME_BYTES);
        startFrame[0] = START_COMMAND;
        writeUint32BE(startFrame, 1, size);
        startFrame.set(name, 5);

        /* Listen before writing: a fast device may reply immediately. */
        const startAckPromise = waitForControl(matchStart, ACK_TIMEOUT_MS);
        if (!(await ble.sendBytes(startFrame))) {
            throw new Error('Bluetooth write was rejected');
        }

        const startAck = await startAckPromise;
        if (stopRequested) {
            throw CANCELLED;
        }
        if (!startAck) {
            throw new Error('No reply to the upload start');
        }
        if (startAck.status !== 0) {
            throw new Error(`Device refused the upload (status ${startAck.status})`);
        }

        const chunkSize = startAck.maxChunk > 0
            ? clampInt(startAck.maxChunk, MIN_CHUNK_BYTES, MAX_CHUNK_BYTES, DEFAULT_CHUNK_BYTES)
            : DEFAULT_CHUNK_BYTES;
        const windowSize = startAck.window > 0
            ? clampInt(startAck.window, 1, MAX_WINDOW, DEFAULT_WINDOW)
            : DEFAULT_WINDOW;
        const total = Math.ceil(size / chunkSize);

        const transfer = {
            pending: new Map(),
            acked: 0,
            error: null,
            wake: null
        };
        activeTransfer = transfer;

        $('gifProgress').hidden = false;
        paintProgress(0, total);

        let nextSeq = 0;

        while (nextSeq < total || transfer.pending.size > 0) {
            if (transfer.error) {
                throw transfer.error;
            }
            if (stopRequested) {
                throw CANCELLED;
            }

            while (nextSeq < total && transfer.pending.size < windowSize) {
                const seq = nextSeq;
                /* Register before writing so an immediate ack is not lost. */
                transfer.pending.set(seq, { attempts: 1, sentAt: Date.now() });
                nextSeq += 1;
                await sendChunk(seq, chunkSize);
            }

            if (!transfer.pending.size && nextSeq >= total) {
                break;
            }

            let earliest = Infinity;
            for (const state of transfer.pending.values()) {
                earliest = Math.min(earliest, state.sentAt + ACK_TIMEOUT_MS);
            }

            if (earliest === Infinity) {
                /* Everything in flight was acked while sending; send more. */
                continue;
            }

            await waitForWake(transfer, Math.max(0, earliest - Date.now()));

            if (transfer.error) {
                throw transfer.error;
            }
            if (stopRequested) {
                throw CANCELLED;
            }

            const now = Date.now();
            const expired = [...transfer.pending.keys()]
                .sort((a, b) => a - b)
                .filter(seq => {
                    const state = transfer.pending.get(seq);
                    return state && state.sentAt + ACK_TIMEOUT_MS <= now;
                });

            for (const seq of expired) {
                const state = transfer.pending.get(seq);
                if (!state) {
                    continue;
                }
                state.attempts += 1;
                if (state.attempts > MAX_ATTEMPTS) {
                    throw new Error(`No reply for chunk ${seq + 1} of ${total}`);
                }
                state.sentAt = Date.now();
                await sendChunk(seq, chunkSize);
            }

            scheduleProgress(transfer.acked, total);
        }

        scheduleProgress(transfer.acked, total);
        flushProgress();
        setStatus('Verifying…');

        const completeFrame = new Uint8Array([
            COMPLETE_COMMAND,
            (fileCrc >>> 8) & 0xff,
            fileCrc & 0xff
        ]);

        const completeAckPromise = waitForControl(matchComplete, ACK_TIMEOUT_MS);
        if (!(await ble.sendBytes(completeFrame))) {
            throw new Error('Bluetooth write was rejected');
        }

        const completeAck = await completeAckPromise;
        if (stopRequested) {
            throw CANCELLED;
        }
        if (!completeAck) {
            throw new Error('No reply to upload completion');
        }
        if (completeAck.status !== 0) {
            const crcText = completeAck.deviceCrc === null
                ? ''
                : `, device CRC 0x${completeAck.deviceCrc.toString(16).padStart(4, '0')}`;
            throw new Error(`Upload rejected (status ${completeAck.status}${crcText})`);
        }
    }

    async function startUpload() {
        if (busy || preparing || !selectedFile || !fileBytes || !ble.hasControl()) {
            return;
        }

        busy = true;
        stopRequested = false;
        stopReason = null;
        refreshControls();

        $('gifProgress').hidden = false;
        $('gifProgressBar').style.width = '0%';
        setStatus('Starting upload…');

        try {
            await runTransfer();
            flushProgress();
            $('gifProgressBar').style.width = '100%';
            $('gifProgress').setAttribute('aria-valuenow', '100');
            setStatus('Upload complete.');
        } catch (error) {
            flushProgress();
            if (error === CANCELLED) {
                if (stopReason === 'disconnect') {
                    setStatus('Upload interrupted: device disconnected.', true);
                } else {
                    setStatus('Upload aborted.');
                }
            } else {
                setStatus(`Error: ${error.message}`, true);
            }
            await abortTransfer();
        } finally {
            activeTransfer = null;
            if (controlWaiter) {
                controlWaiter.done(null);
            }
            busy = false;
            refreshControls();
        }
    }

    async function selectFile(file) {
        if (busy || preparing) {
            return;
        }

        resetProgress();
        selectedFile = null;
        fileBytes = null;
        fileCrc = 0;
        $('gifFileInfo').textContent = 'No file selected';
        $('gifFileInfo').title = '';
        setStatus('Choose a GIF; it is converted to 64 × 64 in the browser (max 1 MiB after conversion).');
        refreshControls();

        if (!file) {
            return;
        }
        if (file.size === 0) {
            setStatus('That file is empty.', true);
            return;
        }

        preparing = true;
        stopRequested = false;
        stopReason = null;
        refreshControls();
        $('gifProgress').hidden = false;
        paintPrepProgress(0, 'Reading…');

        try {
            const result = await gifPrep.prepare(file, {
                onProgress: paintPrepProgress,
                shouldCancel: () => stopRequested
            });

            if (stopRequested) {
                throw gifPrep.CANCELLED;
            }

            selectedFile = file;
            fileBytes = result.bytes;
            fileCrc = crc16Ccitt(fileBytes);

            $('gifFileInfo').textContent = describeResult(file, result);
            $('gifFileInfo').title = `${file.name} — 64 × 64, ${result.frameCount} frames`;
            setStatus(resultMessage(result));
        } catch (error) {
            if (error === gifPrep.CANCELLED || stopRequested) {
                setStatus(stopReason === 'disconnect'
                    ? 'Conversion stopped: device disconnected.'
                    : 'Conversion cancelled.');
            } else {
                setStatus(error && error.message ? error.message : String(error), true);
            }
            selectedFile = null;
            fileBytes = null;
            fileCrc = 0;
        } finally {
            preparing = false;
            stopRequested = false;
            stopReason = null;
            resetProgress();
            refreshControls();
        }
    }

    function cancelUpload() {
        if ((!busy && !preparing) || stopRequested) {
            return;
        }
        stopReason = 'cancel';
        stopRequested = true;
        setStatus('Cancelling…');
        if (activeTransfer && activeTransfer.wake) {
            activeTransfer.wake();
        }
        if (controlWaiter) {
            controlWaiter.done(null);
        }
    }

    function handleDisconnected() {
        if (busy || preparing) {
            stopReason = 'disconnect';
            stopRequested = true;
            if (activeTransfer && activeTransfer.wake) {
                activeTransfer.wake();
            }
            if (controlWaiter) {
                controlWaiter.done(null);
            }
        }
        refreshControls();
    }

    function init() {
        $('gifChooseBtn').addEventListener('click', () => {
            $('gifFileInput').click();
        });

        $('gifFileInput').addEventListener('change', event => {
            const file = (event.target.files && event.target.files[0]) || null;
            event.target.value = '';
            void selectFile(file);
        });

        $('gifStartBtn').addEventListener('click', startUpload);
        $('gifCancelBtn').addEventListener('click', cancelUpload);

        ble.on('connected', refreshControls);
        ble.on('disconnected', handleDisconnected);
        ble.on('frame', handleFrame);

        refreshControls();
    }

    return { init };
})();

/* ==========================================================================
 * Boot
 * ========================================================================== */

function initMandelbrot() {
    // Populated when the Mandelbrot mode is built.
}

ble.init();
simulation.init();
modeSelector.init();
gifUpload.init();
initMandelbrot();
tabs.init();
</script>
